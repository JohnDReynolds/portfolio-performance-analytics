[build-system]
# Build backend and build-time requirements used to build the project.
# - `requires`: list of build-time packages (PEP 517/518). Keep minimal and use
#   lower bounds that are known to support this configuration.
# - `build-backend`: setuptools entrypoint used by the build frontend (e.g., pip).
# Build-time requirements for setuptools-based builds.
requires = ["setuptools>=77.0.0"]
# The build backend used by pip when building wheels/sdist.
build-backend = "setuptools.build_meta"

[project]
# Project metadata (PEP 621).
# - `name`, `version`, `description`: canonical package metadata used by PyPI.
# - `authors`: contact info for package maintainers.
# - `readme` and `license`: point to local files to include in source distributions.
# - `keywords`: short search terms for discovery.
# - `requires-python`: minimum Python version supported; use a conservative
#   lower bound that reflects CI/test matrix.
# - `dependencies`: runtime requirements expressed as minimum compatible versions.
name = "ppar"
version = "0.1.5"
description = "Portfolio performance audit, attribution, contribution, and risk reporting."
authors = [{ name = "John Reynolds", email = "jjjkreynolds@gmail.com" }]
# README file included in the distribution and displayed on PyPI.
readme = "README.md"
# Use an SPDX custom license reference plus a local license file.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
# Helpful search keywords — concise, comma-separated.
keywords = [
    "portfolio",
    "performance",
    "audit",
    "reconciliation",
    "data quality",
    "analytics",
    "attribution",
    "brinson",
    "fachler",
    "risk",
    "statistics",
]
# Minimal Python runtime required to run the package.
requires-python = ">=3.12.1"
# Runtime dependencies. These are lower-bound constraints, not exact pins.
dependencies = [
    "lxml>=5.1.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "polars>=1.24.0",
    "matplotlib>=3.8.2",
    "openpyxl>=3.1",
    "pyarrow>=15.0.1",
    "pyyaml>=6.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
# Developer tooling used for local checks and editor feedback.
dev = [
    "build>=1.2",
    "markdown-it-py>=4.0",
    "mypy>=1.10",
    "pandas-stubs",
    "pytest>=8.0",
    "pylint>=4.0",
    "pyright>=1.1.409",
    "scipy-stubs",
    "setuptools>=77.0.0",
    "types-PyYAML",
    "types-seaborn",
]

[project.scripts]
# Console entry points installed with the package.
ppar = "ppar.cli:main"

[tool.mypy]
python_version = "3.12"
files = [
    "ppar",
    "scripts/demo_support",
    "scripts/operational_demo_data/holdings.py",
]
strict = true
show_error_codes = true
warn_unused_configs = true

[tool.pyright]
include = ["ppar", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pylint.main]
persistent = false
py-version = "3.12"

[tool.pylint.format]
max-line-length = 99

[tool.pylint."messages control"]
enable = [
    "duplicate-code",
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "unused-argument",
    "redefined-outer-name",
    "broad-exception-caught",
]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-branches = 40
max-locals = 30
max-attributes = 12
min-public-methods = 0

[tool.setuptools]
# setuptools-specific configuration.
# - `packages`: list package names included in the distribution.
# - `include-package-data`: include files specified in package-data or MANIFEST.in.
packages = [
    "ppar",
    "ppar.analytics",
    "ppar.axys_apx",
    "ppar.setup_templates",
    "ppar.setup_templates.axys_apx_analytics",
    "ppar.setup_templates.axys_apx_audit",
    "ppar.setup_templates.axys_apx_audit.snapshot_a",
    "ppar.setup_templates.axys_apx_audit.snapshot_b",
    "ppar.setup_templates.generic_analytics",
    "ppar.setup_templates.generic_analytics.classifications",
    "ppar.setup_templates.generic_analytics.mappings",
    "ppar.setup_templates.generic_analytics.performance",
    "ppar.audit",
    "ppar.audit.cli",
    "ppar.audit.data_issues",
    "ppar.audit.performance_comparison",
]
include-package-data = true

[tool.setuptools.package-data]
# Explicit package-data patterns so demo CSVs and typing marker are included.
# - Prefer explicit globs over recursive wildcard where possible for clarity.
# The `py.typed` marker indicates PEP 561 typing support.
# Include demo CSVs used by examples so installed package is usable offline.
ppar = ["py.typed"]
"ppar.setup_templates" = ["*.md"]
"ppar.setup_templates.axys_apx_analytics" = ["*.yaml", "*.csv", "*.py"]
"ppar.setup_templates.axys_apx_audit" = ["*.yaml", "*.md", "*.py"]
"ppar.setup_templates.axys_apx_audit.snapshot_a" = ["*.csv"]
"ppar.setup_templates.axys_apx_audit.snapshot_b" = ["*.csv"]
"ppar.setup_templates.generic_analytics" = ["*.py"]
"ppar.setup_templates.generic_analytics.classifications" = ["*.csv"]
"ppar.setup_templates.generic_analytics.mappings" = ["*.csv"]
"ppar.setup_templates.generic_analytics.performance" = ["*.csv"]

[project.urls]
# Useful project URLs for documentation and source.
# - `Repository`: canonical upstream repository URL.
Repository = "https://github.com/JohnDReynolds/portfolio-performance-analytics"
