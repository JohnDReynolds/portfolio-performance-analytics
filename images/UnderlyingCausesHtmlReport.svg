<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Underlying Causes HTML Report Preview</title>
  <desc id="desc">A simplified preview of the report.html Underlying Causes table.</desc>
  <rect width="1200" height="470" fill="#f8fafc"/>
  <style>
    .title { font: 700 30px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 400 17px Arial, sans-serif; fill: #64748b; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
    .header { fill: #3730a3; }
    .th { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    .td { font: 400 14px Arial, sans-serif; fill: #1f2937; }
    .muted { fill: #eef2ff; }
    .warn { fill: #fff7ed; }
  </style>
  <text x="60" y="58" class="title">Underlying Causes</text>
  <text x="60" y="88" class="subtitle">report.html shows the input differences behind the reported performance difference.</text>
  <rect x="60" y="120" width="1080" height="295" class="card"/>
  <rect x="60" y="120" width="1080" height="46" class="header" rx="8"/>
  <text x="82" y="150" class="th">Portfolio</text>
  <text x="205" y="150" class="th">Period</text>
  <text x="345" y="150" class="th">Dataset</text>
  <text x="500" y="150" class="th">Source Column</text>
  <text x="685" y="150" class="th">B - A Difference</text>
  <text x="870" y="150" class="th">Performance Difference Explained</text>

  <rect x="60" y="166" width="1080" height="48" class="muted"/>
  <text x="82" y="197" class="td">MEGA_ALPHA</text>
  <text x="205" y="197" class="td">2025-10</text>
  <text x="345" y="197" class="td">prices</text>
  <text x="500" y="197" class="td">price</text>
  <text x="685" y="197" class="td">1.240000</text>
  <text x="870" y="197" class="td">0.0004</text>

  <text x="82" y="245" class="td">MEGA_ALPHA</text>
  <text x="205" y="245" class="td">2025-10</text>
  <text x="345" y="245" class="td">transactions</text>
  <text x="500" y="245" class="td">amount</text>
  <text x="685" y="245" class="td">250.000000</text>
  <text x="870" y="245" class="td">0.0001</text>

  <rect x="60" y="262" width="1080" height="48" class="warn"/>
  <text x="82" y="293" class="td">MEGA_ALPHA</text>
  <text x="205" y="293" class="td">2025-11</text>
  <text x="345" y="293" class="td">positions</text>
  <text x="500" y="293" class="td">market_value</text>
  <text x="685" y="293" class="td">2648.560000</text>
  <text x="870" y="293" class="td">YAML setup required</text>

  <text x="82" y="341" class="td">MEGA_ALPHA</text>
  <text x="205" y="341" class="td">2025-11</text>
  <text x="345" y="341" class="td">cash</text>
  <text x="500" y="341" class="td">cash_balance</text>
  <text x="685" y="341" class="td">1000.000000</text>
  <text x="870" y="341" class="td">0.0002</text>
</svg>
