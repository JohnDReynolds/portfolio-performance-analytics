comparison:
  name: Axys site variant with alternate contextual fee rule
  level: portfolio

snapshots:
  a:
    label: alternate_fee_a
    path: snapshot_a
    schema: ../source_column_mappings.yaml
  b:
    label: alternate_fee_b
    path: snapshot_b
    schema: ../source_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  transactions: transactions.csv

extract_contract:
  enforce_ambiguous_axys_flows: true
  transaction_semantics_case: legacy_case_insensitive

tolerances:
  return: 0.000001
  market_value: 0.01
  quantity: 0.000001
  price: 0.000001
  split_factor: 0.00000001
  fx_rate: 0.00000001

transaction_impact_methods:
  external_flow:
    method: evidence_only
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value
  quantity:
    method: evidence_only
  price:
    method: evidence_only
  commission:
    method: evidence_only

transaction_rules:
  dp:
    - when:
        special_security_type: epus
        special_security_symbol: expense
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
