# REP/report-style review-only action contract.
#
# These rows intentionally use source-supplied category/sign semantics. The
# fixture proves correction/cancellation and synthetic corporate-action rows can
# be carried as neutral review evidence without becoming formula inputs.
datasets:
  transactions.csv:
    columns:
      TRANSACTION_CATEGORY:
        requires_context_for_semantics: true
        blocking_if_missing: true
      CASH_FLOW_SIGN:
        requires_context_for_semantics: true
        blocking_if_missing: true
      PERFORMANCE_FLOW_SIGN:
        requires_context_for_semantics: true
        blocking_if_missing: true
