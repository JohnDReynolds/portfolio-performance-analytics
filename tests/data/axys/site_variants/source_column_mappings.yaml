# Explicit source headings shared by the compact Axys/APX site variants.
files:
  portfolio_performance:
    columns:
      portfolio_code: PORT
      from_date: FROM_DATE
      thru_date: THRU_DATE
      portfolio_return: RETURN

  transactions:
    columns:
      portfolio_code: PORT
      identifier: SEC
      transaction_date: TRANSACTION_DATE
      settlement_date: SETTLE_DATE
      transaction_code: TRAN
      transaction_security_type: SEC_TYPE
      source_destination_type: SRC_DEST_TYPE
      source_destination_symbol: SRC_DEST_SYMBOL
      special_security_type: SPECIAL_SEC_TYPE
      special_security_symbol: SPECIAL_SEC_SYMBOL
      transaction_category: TRANSACTION_CATEGORY
      cash_flow_sign: CASH_FLOW_SIGN
      performance_flow_sign: PERFORMANCE_FLOW_SIGN
      quantity: QTY
      amount: AMOUNT
