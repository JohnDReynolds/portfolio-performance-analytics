comparison:
  name: Axys site variant with REP/report transaction semantics
  level: portfolio

snapshots:
  a:
    label: rep_semantics_a
    path: snapshot_a
    vendor: axys
  b:
    label: rep_semantics_b
    path: snapshot_b
    vendor: axys

files:
  portfolio_performance: portperf.csv
  transactions: transactions.csv

extract_contract:
  path: site_extract_contract.yaml
  enforce_ambiguous_axys_flows: true
  transaction_semantics_case: legacy_case_insensitive

tolerances:
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
  quantity: 0.000001
  price: 0.000001
  split_factor: 0.00000001
  fx_rate: 0.00000001

transaction_impact_methods:
  external_flow:
    method: evidence_only
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value
  quantity:
    method: evidence_only
  price:
    method: evidence_only
  commission:
    method: evidence_only
