comparison:
  name: Axys site variant with reviewed local ambiguous-flow opt-out
  level: portfolio

snapshots:
  a:
    label: local_opt_out_a
    path: snapshot_a
    schema: ../source_column_mappings.yaml
  b:
    label: local_opt_out_b
    path: snapshot_b
    schema: ../source_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  transactions: transactions.csv

extract_contract:
  enforce_ambiguous_axys_flows: false
  transaction_semantics_case: legacy_case_insensitive

tolerances:
  return: 0.000001
  market_value: 0.01
  quantity: 0.000001
  price: 0.000001
  split_factor: 0.00000001
  fx_rate: 0.00000001

transaction_impact_methods:
  external_flow:
    method: evidence_only
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value
  quantity:
    method: evidence_only
  price:
    method: evidence_only
  commission:
    method: evidence_only

transaction_rules:
  li:
    transaction_category: external_flow
    cash_flow_sign: positive
    performance_flow_sign: external
  lo:
    transaction_category: external_flow
    cash_flow_sign: negative
    performance_flow_sign: external
  dp:
    transaction_category: fee_expense
    cash_flow_sign: negative
    performance_flow_sign: performance
  wd:
    transaction_category: external_flow
    cash_flow_sign: negative
    performance_flow_sign: external
