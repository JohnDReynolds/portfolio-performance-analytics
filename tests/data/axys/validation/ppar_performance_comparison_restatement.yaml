# =========================
# PPAR Performance Comparison Configuration
# =========================
# This fixture compares the baseline Axys snapshot with a controlled
# restatement snapshot containing intentional differences.

comparison:
  name: Axys fixture controlled restatement comparison

snapshots:
  a:
    label: axys_a
    path: ../snapshots/axys_a
    vendor: axys
    schema: ../axys_column_mappings.yaml

  b:
    label: axys_b_restatement
    path: ../snapshots/axys_b_restatement
    vendor: axys
    schema: ../axys_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  security_performance: secperf.csv
  security_master: sec_ref.csv
  prices: prices.csv
  fx_rates: fx_rates.csv
  transactions: transactions.csv
  holdings: holdings.csv
  cash: cash.csv

contribution_impact_methods:
  portfolio_source_field:
    method: source_field_delta_over_begin_market_value
    denominator_source: begin_market_value
    source_fields:
      - income
      - gain_loss
  security_contribution:
    method: vendor_contribution_delta
  security_return:
    method: security_return_delta_times_weight
    weight_source: snapshot_a_weight

tolerances:
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
  price: 0.000001
  fx_rate: 0.00000001
