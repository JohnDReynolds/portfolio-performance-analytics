# =========================
# PPAR Performance Comparison Configuration
# =========================
# This fixture compares the baseline Axys snapshot with the controlled
# restatement snapshot, using YAML transaction rules to supply sign/flow
# semantics that are not present in the Axys transaction CSVs.

comparison:
  name: Axys fixture restatement comparison with transaction rules
  level: portfolio

snapshots:
  a:
    label: axys_a
    path: ../snapshots/axys_a
    schema: ../axys_column_mappings.yaml

  b:
    label: axys_b_restatement
    path: ../snapshots/axys_b_restatement
    schema: ../axys_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  security_performance: secperf.csv
  fx_rates: fx_rates.csv
  transactions: transactions.csv
  holdings: holdings.csv

extract_contract:
  enforce_ambiguous_axys_flows: true
  transaction_semantics_case: legacy_case_insensitive

contribution_impact_methods:
  portfolio_source_field:
    method: source_field_delta_over_begin_market_value
    denominator_source: begin_market_value
    source_fields:
      - income
      - gain_loss
  security_contribution:
    method: vendor_contribution_delta
  security_return:
    method: security_return_delta_times_weight
    weight_source: snapshot_a_weight

fx_rate_impact_methods:
  fx_rate:
    method: evidence_only

transaction_rules:
  BUY:
    transaction_category: buy
    cash_flow_sign: negative
    performance_flow_sign: performance
  SELL:
    transaction_category: sell
    cash_flow_sign: positive
    performance_flow_sign: performance
  DIV:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  INT:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance

transaction_impact_methods:
  # External-flow rows remain review evidence unless a supported diagnostic
  # cross-check such as modified_dietz is explicitly configured.
  external_flow:
    method: evidence_only
  # Performance-treated amount deltas are estimated only when this method and
  # denominator source are explicitly selected.
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value
  quantity:
    method: evidence_only
  price:
    method: evidence_only
  commission:
    method: evidence_only

holding_impact_methods:
  market_value:
    method: market_value_delta_over_return_denominator
    denominator_source: begin_market_value
  accrued:
    method: accrued_delta_over_return_denominator
    denominator_source: begin_market_value
  quantity:
    method: quantity_delta_times_snapshot_a_unit_market_value_over_return_denominator
    denominator_source: begin_market_value
  cost:
    method: evidence_only

price_impact_methods:
  price:
    method: price_delta_over_snapshot_a_price_times_weight
    weight_source: snapshot_a_weight

tolerances:
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
  quantity: 0.000001
  price: 0.000001
  split_factor: 0.00000001
  fx_rate: 0.00000001
