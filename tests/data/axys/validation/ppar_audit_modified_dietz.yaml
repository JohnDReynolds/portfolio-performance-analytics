# =========================
# PPAR Performance Comparison Configuration
# =========================
# This fixture demonstrates the cross-check-only Modified Dietz diagnostic
# path for external-flow transaction amount changes.

comparison:
  name: Axys fixture Modified Dietz external-flow cross-check
  level: portfolio

snapshots:
  a:
    label: axys_modified_dietz_a
    path: ../snapshots/axys_modified_dietz_a
    schema: ../axys_column_mappings.yaml

  b:
    label: axys_modified_dietz_b
    path: ../snapshots/axys_modified_dietz_b
    schema: ../axys_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  transactions: transactions.csv

extract_contract:
  enforce_ambiguous_axys_flows: true
  transaction_semantics_case: legacy_case_insensitive

transaction_rules:
  DEP:
    transaction_category: external_flow
    cash_flow_sign: positive
    performance_flow_sign: external

transaction_impact_methods:
  external_flow:
    method: modified_dietz
    flow_timing: trade_date
    day_count: actual_days
    inclusion_rule: beginning_of_day
    denominator_source: begin_market_value
    double_count_policy: cross_check_only
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value
  quantity:
    method: evidence_only
  price:
    method: evidence_only
  commission:
    method: evidence_only

tolerances:
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
  quantity: 0.000001
  price: 0.000001
  split_factor: 0.00000001
  fx_rate: 0.00000001
