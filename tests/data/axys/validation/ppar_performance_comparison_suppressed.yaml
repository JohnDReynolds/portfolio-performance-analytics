# =========================
# PPAR Performance Comparison Configuration
# =========================
# This fixture compares the baseline Axys snapshot with the controlled
# restatement snapshot and suppresses one known example finding.

comparison:
  name: Axys fixture controlled restatement comparison with suppressions
  level: security

snapshots:
  a:
    label: axys_a
    path: ../snapshots/axys_a
    vendor: axys
    schema: ../axys_column_mappings.yaml

  b:
    label: axys_b_restatement
    path: ../snapshots/axys_b_restatement
    vendor: axys
    schema: ../axys_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  security_performance: secperf.csv
  fx_rates: fx_rates.csv
  transactions: transactions.csv
  holdings: holdings.csv
  cash: cash.csv

security_return_impact_methods:
  transactions:
    method: modified_dietz
    flow_timing: transaction_date
    day_count: actual_days
    inclusion_rule: beginning_of_day

tolerances:
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
  price: 0.000001
  fx_rate: 0.00000001

suppressions:
  - code: pc-sec-ret
    security_id: AAPL
    source_column: security_return
    reason: Example suppression for a known controlled restatement.
