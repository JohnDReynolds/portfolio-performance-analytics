name: Release candidate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Create project environment
        run: python -m venv .venv

      - name: Install constrained project dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install \
            --constraint constraints/ci.txt \
            --editable ".[analytics,dev]"

      - name: Run deterministic release-candidate checks
        run: ./.venv/bin/python scripts/check_release_candidate.py

      - name: Build and smoke-test distributions
        run: |
          ./.venv/bin/python scripts/check_project.py \
            --build \
            --skip-tests \
            --skip-types \
            --skip-pylint
