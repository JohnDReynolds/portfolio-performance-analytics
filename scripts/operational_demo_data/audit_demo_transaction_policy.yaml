# Executable transaction policy used only to rebuild the packaged Audit demo.
#
# The generator implements generic accounting effects. Transaction-code
# membership and contextual qualification live here so demo behavior does not
# become a second, implicit transaction policy in Python.
schema_version: 1

holding_effects:
  by:
    effect: security_trade_and_cash
    quantity_multiplier: 1
  sl:
    effect: security_trade_and_cash
    quantity_multiplier: -1
    cost_basis: proportional_existing
  ss:
    effect: cash
  cs:
    effect: cash
  ";":
    effect: security_quantity
    quantity_multiplier: 1
  pa:
    effect: cash
  sa:
    effect: cash
  pd:
    effect: principal_and_cash
  ti:
    effect: security_quantity
    quantity_multiplier: 1
  ai:
    effect: cash
  dv:
    effect: cash
  in:
    effect: cash
  dp:
    effect: cash
  rc:
    when:
      special_security_type: return_of_capital
    effect: cash
  li:
    when:
      security_id: CASHUSD
      source_destination_type: $pty
      source_destination_symbol: $cash
    effect: cash
  lo:
    when:
      security_id: CASHUSD
      source_destination_type: $pty
      source_destination_symbol: $cash
    effect: cash
  wd:
    when:
      security_id: CASHUSD
      source_destination_type: $pty
      source_destination_symbol: $cash
    effect: cash

reconstruction_roles:
  security_flow: [by, pd, sl]
  income: [ai, dv, in, dp, rc, pa, sa]
  portfolio_external_flow:
    li:
      when:
        source_destination_type: $pty
    lo:
      when:
        source_destination_type: $pty
    ti:
      when:
        security_type: csus
        source_destination_type: $pty
        source_destination_symbol: external_delivery
    wd:
      when:
        security_id: CASHUSD
        source_destination_type: $pty
        source_destination_symbol: $cash
