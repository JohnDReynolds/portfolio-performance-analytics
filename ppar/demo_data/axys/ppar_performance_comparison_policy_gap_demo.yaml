# =========================
# PPAR Performance Comparison Configuration
# =========================
# This demo intentionally leaves selected YAML policy inputs incomplete. It is
# meant to exercise reviewer-facing Problems-grid actions, not to model a fully
# resolved client configuration.

comparison:
  name: Axys fixture policy-gap review demo

snapshots:
  a:
    label: axys_a
    path: axys_a
    vendor: axys
    schema: axys_column_mappings.yaml

  b:
    label: axys_b_multi_restatement
    path: axys_b_multi_restatement
    vendor: axys
    schema: axys_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  security_performance: secperf.csv
  security_master: sec_ref.csv
  prices: prices.csv
  fx_rates: fx_rates.csv
  transactions: transactions.csv
  positions: positions_holdings.csv
  cash: cash.csv

contribution_impact_methods:
  security_contribution:
    method: vendor_contribution_delta

tolerances:
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
  price: 0.000001
  fx_rate: 0.00000001
