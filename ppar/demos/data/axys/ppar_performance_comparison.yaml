# =========================
# PPAR Performance Comparison Configuration
# =========================
# This Mega-Cap operational fixture demonstrates the default field-role model
# plus explicit transaction semantics. Demo commands choose portfolio or
# security report level at runtime.
#
# This file is the accepted seed for a future vendor preset such as
# `vendor: axys`, but it is not a hidden preset today. Keep policy choices
# explicit and auditable until vendor preset implementation exists.

comparison:
  name: Axys performance comparison demo

snapshots:
  a:
    label: axys_full_spec_a
    path: axys_full_spec_a
    vendor: axys
    schema: axys_column_mappings.yaml

  b:
    label: axys_full_spec_b
    path: axys_full_spec_b
    vendor: axys
    schema: axys_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  security_performance: secperf.csv
  holdings: holdings.csv
  transactions: transactions.csv

portfolio_return_reconstruction:
  # Portfolio Modified Dietz uses holdings for beginning/ending value and only
  # transactions classified as external_flow for dated external flows.
  method: modified_dietz
  beginning_value_source: holdings
  ending_value_source: holdings
  flow_source: transactions
  flow_timing: transaction_date
  day_count: actual_days
  inclusion_rule: beginning_of_day
  flow_categories:
    - external_flow
  income_categories:
    - income
    - fee_expense
  return_basis: net
  sign_convention: signed_amount

security_return_reconstruction:
  # Security Modified Dietz treats buys and sells as security-level flows. It
  # does not turn those trades into portfolio-level external flows.
  method: modified_dietz
  beginning_value_source: holdings
  ending_value_source: holdings
  flow_source: transactions
  flow_timing: transaction_date
  day_count: actual_days
  inclusion_rule: beginning_of_day
  flow_categories:
    - buy
    - sell
  income_categories:
    - income
    - fee_expense
  return_basis: net
  sign_convention: signed_amount

transaction_rules:
  # Packaged transaction rows currently use by, sl, dv, in, fee-like dp,
  # external-cash li, external-cash lo, and external-cash wd. Rules for ";"
  # are retained as defensive guardrails/reserved semantics, not as current
  # packaged rows.
  by:
    transaction_category: buy
    cash_flow_sign: negative
    performance_flow_sign: performance
  sl:
    transaction_category: sell
    cash_flow_sign: positive
    performance_flow_sign: performance
  dv:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  # Demo assumption: reported returns are net of fees, so fee changes are
  # performance-impacting. Gross-of-fees returns need an explicit future
  # return-basis policy before fees should be treated this way.
  dp:
    - when:
        special_security_type: exus
        special_security_symbol: custfee
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
  in:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  li:
    # Long-in is external only with reviewed external-party context; internal
    # account movement remains neutral transfer.
    - when:
        source_destination_type: $pty
      transaction_category: external_flow
      cash_flow_sign: positive
      performance_flow_sign: external
    - when:
        source_destination_type: $acct
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral
  lo:
    # Long-out is external only with reviewed external-party context; internal
    # account movement remains neutral transfer.
    - when:
        source_destination_type: $pty
      transaction_category: external_flow
      cash_flow_sign: negative
      performance_flow_sign: external
    - when:
        source_destination_type: $acct
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral
  ";":
    # Reserved corporate-action/journal marker. User-facing split examples
    # should wait for a real historical event and explicit policy.
    transaction_category: corporate_action
    cash_flow_sign: none
    performance_flow_sign: neutral
  wd:
    # Withdrawal is external only for the packaged CASH_USD external-party case;
    # sweep-like rows remain neutral transfer.
    - when:
        security_id: CASH_USD
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: external_flow
      cash_flow_sign: negative
      performance_flow_sign: external
    - when:
        source_destination_type: $sweep
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral

transaction_impact_methods:
  external_flow:
    method: modified_dietz
    flow_timing: trade_date
    day_count: actual_days
    inclusion_rule: beginning_of_day
    denominator_source: begin_market_value
    double_count_policy: cross_check_only
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value

security_return_impact_methods:
  transactions:
    method: modified_dietz
    flow_timing: transaction_date
    day_count: actual_days
    inclusion_rule: beginning_of_day

tolerances:
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
