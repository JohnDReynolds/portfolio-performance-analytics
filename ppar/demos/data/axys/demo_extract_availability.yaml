# Machine-readable extraction-confidence contract for the packaged Axys demo
# CSV fields. Keep this aligned with docs/axys-apx-reference/
# Appendix_Demo_Extract_Availability.md.
version: 1
scope:
  snapshots:
    - axys_full_spec_a
    - axys_full_spec_b
  purpose: >
    Every packaged full-spec Axys demo CSV column must have an explicit
    IMEX/REP availability confidence decision.
confidence_labels:
  high: Strongly likely to be obtainable from a typical Axys environment.
  medium_high: Between medium and high; likely available, but still report/profile dependent.
  medium: Plausible, but site configuration, report choice, or export profile must be validated.
  medium_unknown: Between medium and unknown; evidence mentions the area, but not the exact object/field.
  low_medium: Between low and medium; possible and plausible, but not proven as a standard field.
  low: Possible through customization or site-specific configuration, but not enough to rely on.
  unknown: Not established by the local Axys/APX reference corpus.
datasets:
  holdings.csv:
    columns:
      PORT:
        normalized_meaning: Portfolio/account identifier.
        imex_confidence: high
        rep_confidence: high
        comments: Core portfolio/client identifier in position and appraisal workflows.
        basis: Position/appraisal evidence in Chapter_06_Holdings.md, Chapter_12_Imex.md, Chapter_13_Rep.md, and axys_common_core_export.md.
        open_questions:
        - Confirm exact local IMEX profile and field name.
        candidate_axys_names:
        - PORT
        - Portfolio
        - Portfolio Code
        - Account
        candidate_report_labels:
        - Portfolio
        - Account
        name_confidence: inferred_alias
        name_notes: Candidate aliases only; confirm against the local IMEX profile, REP output, or vendor field dictionary.
        preferred_source: imex_or_rep
        fallback_source: rep_preferred
        requires_context_for_semantics: false
        blocking_if_missing: true
        source_strategy_notes: Holdings reconstruction can use either validated position/appraisal IMEX output or an appraisal-style
