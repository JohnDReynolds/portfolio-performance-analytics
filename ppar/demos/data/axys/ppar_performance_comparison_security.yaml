# =========================
# PPAR Security Performance Comparison Configuration
# =========================
# This Mega-Cap operational fixture demonstrates security-level performance
# comparison using the default field-role model plus explicit transaction
# semantics.

comparison:
  name: Axys security causal attribution demo
  level: security

snapshots:
  a:
    label: axys_full_spec_a
    path: axys_full_spec_a
    vendor: axys
    schema: axys_column_mappings.yaml

  b:
    label: axys_full_spec_b
    path: axys_full_spec_b
    vendor: axys
    schema: axys_column_mappings.yaml

files:
  portfolio_performance: portperf.csv
  security_performance: secperf.csv
  holdings: holdings.csv
  transactions: transactions.csv

portfolio_return_reconstruction:
  method: modified_dietz
  beginning_value_source: holdings
  ending_value_source: holdings
  flow_source: transactions
  flow_timing: transaction_date
  day_count: actual_days
  inclusion_rule: beginning_of_day
  flow_categories:
    - external_flow
  income_categories:
    - income
    - fee_expense
  return_basis: net
  sign_convention: signed_amount

security_return_reconstruction:
  method: modified_dietz
  beginning_value_source: holdings
  ending_value_source: holdings
  flow_source: transactions
  flow_timing: transaction_date
  day_count: actual_days
  inclusion_rule: beginning_of_day
  flow_categories:
    - buy
    - sell
  income_categories:
    - income
    - fee_expense
  return_basis: net
  sign_convention: signed_amount

transaction_rules:
  BUY:
    transaction_category: buy
    cash_flow_sign: negative
    performance_flow_sign: performance
  SELL:
    transaction_category: sell
    cash_flow_sign: positive
    performance_flow_sign: performance
  DIV:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  # Demo assumption: reported returns are net of fees, so fee changes are
  # performance-impacting. Gross-of-fees returns need an explicit future
  # return-basis policy before fees should be treated this way.
  FEE:
    transaction_category: fee_expense
    cash_flow_sign: negative
    performance_flow_sign: performance
  INT:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  SPLIT:
    transaction_category: corporate_action
    cash_flow_sign: none
    performance_flow_sign: neutral
  WD:
    transaction_category: external_flow
    cash_flow_sign: negative
    performance_flow_sign: external

transaction_impact_methods:
  external_flow:
    method: modified_dietz
    flow_timing: trade_date
    day_count: actual_days
    inclusion_rule: beginning_of_day
    denominator_source: begin_market_value
    double_count_policy: cross_check_only
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value

security_return_impact_methods:
  transactions:
    method: modified_dietz
    flow_timing: transaction_date
    day_count: actual_days
    inclusion_rule: beginning_of_day

tolerances:
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
