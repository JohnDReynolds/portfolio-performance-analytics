# ==============================================================================
# PPAR Axys/APX Analytics Configuration
# ==============================================================================
# This file has been copied to your setup directory as analytics/ppar.yaml.
#
# The default command to run Analytics is:
#   ppar analytics ./my_ppar_data/analytics
#
# To customize with your own data:
# 1. Replace portperf.csv, secperf.csv, and secmast.csv with your own IMEX/REP
#    CSV files.
# 2. If paths, filenames, or column names differ, edit files.*.path or
#    files.*.columns below.
# 3. Set analytics.portfolio and analytics.benchmark below to actual portfolio
#    codes contained in your CSV files.
# 4. Run ppar analytics ./my_ppar_data/analytics again and review the outputs.

# ==============================================================================
# Analytics Runtime Parameters
# ==============================================================================
analytics:
  # Command-line values override the YAML values below. Settings with
  # documented defaults may be omitted.

  # Axys/APX account code for the portfolio being reviewed.
  # Default: None (must be supplied here or on the command line)
  # Command-line override: --portfolio MYPORT
  portfolio: MEGA_ALPHA

  # Axys/APX account code for the comparison benchmark or index.
  # Default: None (must be supplied here or on the command line)
  # Command-line override: --benchmark MYBENCH
  benchmark: MEGA_BENCH

  # Reporting-period frequency: monthly, quarterly, or yearly.
  # Default: Use the performance periods as supplied in the source files.
  # Risk Statistics require a fixed frequency and are omitted by this default.
  # Command-line override: --frequency monthly (m, q, and y also work)
  frequency: quarterly

  # Directory where the output files are written. A relative path is anchored
  # to this analytics directory; PPAR creates it when needed.
  # Default: output
  # Command-line override: --output-directory ./review_output
  output_directory: output

  # Inclusive first date of performance history to load, in YYYY-MM-DD form.
  # Default: None (use the earliest available date)
  # Command-line override: --from-date 2022-01-01
  from_date: 2021-06-01

  # Inclusive last date of performance history to load, in YYYY-MM-DD form.
  # Default: None (use the latest available date)
  # Command-line override: --thru-date 2025-12-31
  thru_date: 2026-05-29

  # Reporting classification. This must match one of the "mappings" names below.
  # Default: Security
  # Command-line override: --classification "Asset Class"
  classification: Economic Sector

  # Annual target used by downside-risk statistics, expressed as a decimal.
  # Default: 0.00
  # Command-line override: --annual-minimum-acceptable-return 0.01
  annual_minimum_acceptable_return: 0.00

  # Annual risk-free rate used by risk-adjusted statistics, as a decimal.
  # Default: 0.03
  # Command-line override: --annual-risk-free-rate 0.04
  annual_risk_free_rate: 0.03

  # Confidence level used for value-at-risk calculations, as a decimal.
  # Default: 0.95
  # Command-line override: --confidence-level 0.99
  confidence_level: 0.95

  # Portfolio value used to express value at risk as a monetary amount.
  # Default: 100000
  # Command-line override: --portfolio-value 1000000
  portfolio_value: 100000

  # Currency symbol shown with the value-at-risk amount.
  # Default: "$"
  # Command-line override: --currency-symbol "$"
  currency_symbol: "$"

# ==============================================================================
# Analytics Source CSV Files
# ==============================================================================
files:
  portfolio_performance:
    # Portfolio-level performance CSV file.
    # Default: portperf.csv
    # Required columns: From Date, Thru Date, Portfolio Code, Portfolio Name,
    #   Portfolio Return.
    path: portperf.csv
    columns:
      from_date: "From Date"
      thru_date: "Thru Date"
      portfolio_code: "Portfolio Code"
      portfolio_name: "Portfolio Name"
      portfolio_return: "Portfolio Return"

  security_performance:
    # Security-level performance CSV file.
    # Default: secperf.csv
    # Required columns: From Date, Thru Date, Portfolio Code, Security Symbol,
    #   Security Type, Beginning Weight, Security Return, Contribution.
    path: secperf.csv
    columns:
      from_date: "From Date"
      thru_date: "Thru Date"
      portfolio_code: "Portfolio Code"
      security_symbol: "Security Symbol"
      security_type: "Security Type"
      security_return: "Security Return"
      weight: "Beginning Weight"
      contribution: "Contribution"

  security_master:
    # Security master CSV file.
    # Default: secmast.csv
    # Required columns: Security Symbol, Security Type, Security Name.
    # Optional classification columns: Asset Class Code, Asset Class Name,
    #   Sector Code, Sector Name, Country Code, Country Name, Currency Code,
    #   Currency Name, or any other columns used in the mappings below.
    path: secmast.csv
    columns:
      security_symbol: "Security Symbol"
      security_type: "Security Type"
      security_name: "Security Name"


# ==============================================================================
# Reporting Classification Mappings
# ==============================================================================
mappings:
  # Each mapping names source columns in secmast.csv that classify a security.
  #
  # classification_column:
  #   Code column used for grouping, sorting, and joins.
  #
  # display_name_column:
  #   Human-readable label shown in reports.
  #
  # Add or remove mappings to match the classifications you want to report.
  # The value before the colon is the user-facing classification name. If you
  # change analytics.classification above, the new value must exist here.
  Economic Sector:
    classification_column: "Sector Code"
    display_name_column: "Sector Name"

  Asset Class:
    classification_column: "Asset Class Code"
    display_name_column: "Asset Class Name"

  Country:
    classification_column: "Country Code"
    display_name_column: "Country Name"

  Currency:
    classification_column: "Currency Code"
    display_name_column: "Currency Name"
