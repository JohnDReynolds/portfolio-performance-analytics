# ==============================
# PPAR Axys/APX Analytics Starter
# ==============================
# This file is copied to your setup folder as analytics/ppar.yaml. Treat it as
# both the configuration file and the onboarding guide for Analytics.
#
# Big picture:
# - Analytics explains portfolio performance versus a benchmark.
# - The starter expects Axys/APX IMEX portfolio-performance and
#   security-performance CSV exports.
# - Keep CSV files beside this YAML unless you intentionally change the paths.
# - Replace the starter CSV files with your own IMEX CSVs before onboarding a
#   real site.
#
# The default command is:
#
#   ppar analytics ./my_ppar_data/analytics
#
# First site setup:
# 1. Replace portperf.csv, secperf.csv, and secref.csv with IMEX CSVs from your
#    site.
# 2. Keep the starter filenames if you can. If names differ, edit the path
#    settings below.
# 3. Keep the starter headers if you can. If headers differ, uncomment and edit
#    the column override examples below.
# 4. Change analytics.portfolio and analytics.benchmark to real portfolio codes.
# 5. Run ppar analytics again and review the output folder.

analytics:
  # Required. Portfolio and benchmark are Axys/APX account codes found in
  # portperf.csv. The portfolio is the account you are reviewing. The benchmark
  # is the comparison account/index used for active return and attribution.
  # Use command-line overrides only for one-off runs:
  #   ppar analytics ./my_ppar_data/analytics --portfolio MYPORT --benchmark MYBENCH
  portfolio: MEGA_ALPHA
  benchmark: MEGA_BENCH

  # Required. Controls the reporting periods used in the output.
  # Allowed values: monthly, quarterly, yearly.
  # Command-line short forms also work: m, q, y.
  frequency: quarterly

  # Optional. Output is relative to the analytics folder unless you pass
  # --output. The command creates this folder when needed.
  output_directory: output

  # Optional one-run assumptions. These use PPAR's library defaults when
  # omitted and can also be overridden by matching command-line options.
  # from_date: "2021-06-01"
  # thru_date: "2026-05-29"
  # classification: Economic Sector
  # annual_minimum_acceptable_return: 0.00
  # annual_risk_free_rate: 0.03
  # confidence_level: 0.95
  # portfolio_value: 100000
  # currency_symbol: "$"

defaults:
  # Required for the starter. These dates limit the performance history loaded
  # from the CSV files. Use full ISO dates: YYYY-MM-DD.
  from_date: 2021-06-01
  thru_date: 2026-05-29

  # Required. This is the primary classification used for attribution tables,
  # HTML, and chart files. It must match one mapping name below.
  classification: Economic Sector

# Required CSVs for Analytics.
#
# portfolio_performance_path:
#   Portfolio-level performance CSV. For Axys/APX onboarding, start with an
#   IMEX portfolio-performance export containing returns for the portfolio and
#   benchmark. Required columns are the portfolio/account code, from date, thru
#   date, and portfolio return.
#   Starter headers: FROM_DATE, THRU_DATE, PORTFOLIO_CODE, PORTFOLIO_NAME,
#   PORT_RETURN.
#
# security_performance_path:
#   Security-level performance CSV. For Axys/APX onboarding, start with an IMEX
#   security-performance export containing security returns, weights, and
#   contribution. Required columns are portfolio or
#   account code, security code, from date, thru date, security return, weight,
#   and contribution.
#   Starter core headers: FROM_DATE, THRU_DATE, PORTFOLIO_CODE, SECURITY_ID,
#   BEGIN_WEIGHT, SEC_RETURN, CONTRIBUTION.
#
# security_master_path:
#   Security display/classification lookup. The starter uses secref.csv so
#   descriptive reference data is stored once instead of being repeated for
#   every security-performance period. Required starter headers are SECURITY_ID,
#   SECURITY_NAME, ASSET_CLASS_CODE, ASSET_CLASS_DESC, SECTOR_CODE, SECTOR_DESC,
#   COUNTRY_CODE, COUNTRY_DESC, CURRENCY_CODE, and CURRENCY_DESC.
portfolio_performance_path: portperf.csv
security_performance_path: secperf.csv
security_master_path: secref.csv

# Optional portfolio-performance column overrides.
# Leave this commented out when your CSV uses the starter headers or another
# common Axys/APX IMEX spelling PPAR can infer. Uncomment only the rows your
# local export names differently.
#
# portfolio_performance_columns:
#   from_date: FROM_DATE
#   thru_date: THRU_DATE
#   portfolio_code: PORTFOLIO_CODE
#   portfolio_name: PORTFOLIO_NAME
#   portfolio_return: PORT_RETURN

# Optional security-performance column overrides.
# Leave this commented out when your CSV uses the starter headers or another
# common Axys/APX IMEX spelling PPAR can infer. Uncomment only the rows your
# local export names differently.
#
# security_performance_columns:
#   from_date: FROM_DATE
#   thru_date: THRU_DATE
#   identifier: SECURITY_ID
#   portfolio_code: PORTFOLIO_CODE
#   return: SEC_RETURN
#   weight: BEGIN_WEIGHT
#   contribution: CONTRIBUTION

mappings:
  # Each mapping names source columns in secref.csv that classify a security.
  #
  # classification_column:
  #   Code column used for grouping, sorting, and joins.
  #
  # display_name_column:
  #   Human-readable label shown in reports.
  #
  # Add or remove mappings to match the classifications you want to report.
  # The value before the colon is the user-facing classification name. If you
  # change defaults.classification above, the new value must exist here.
  Economic Sector:
    classification_column: SECTOR_CODE
    display_name_column: SECTOR_DESC

  Asset Class:
    classification_column: ASSET_CLASS_CODE
    display_name_column: ASSET_CLASS_DESC

  Country:
    classification_column: COUNTRY_CODE
    display_name_column: COUNTRY_DESC

  Currency:
    classification_column: CURRENCY_CODE
    display_name_column: CURRENCY_DESC
