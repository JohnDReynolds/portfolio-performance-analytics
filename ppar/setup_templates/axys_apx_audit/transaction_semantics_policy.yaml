# Executable transaction-semantics policy shared by runtime safety guards.
#
# Economic classifications belong in the comparison YAML's transaction_rules
# section. Python loads this policy only for documented boundary membership; it
# does not define transaction-code meanings.
schema_version: 1

boundary_groups:
  packaged_formula: [by, dv, in, sl]
  contextual_packaged: [ai, ti]
  ambiguous_context_required: [dp, li, lo, ti, wd]
  context_only: [epus, exus]
  fixed_income_safe: [in]
  fixed_income_accrued_interest: [pa, sa]
  fixed_income_backlog: [ai, pd]
  capital_return_backlog: [pd, rc]
  short_side_backlog: [cs, ss]
  standalone_backlog: [epus]
  data_issue_buy: [by]
  data_issue_dividend: [dv]
  data_issue_accrual: [pa, sa]
  quantity_holding_neutral: [cs, ss]
