# PPAR mappings for the Axys/APX-style Audit starter extracts.
#
# Source headings intentionally resemble readable IMEX/REP report captions.
# PPAR matches every configured heading exactly, including spaces and case.
# Any omitted mapping falls back only to the exact normalized field name; PPAR
# does not guess alternate vendor headings.

# Axys/APX security identity is the security-type/symbol pair. Human-facing
# exports usually present Symbol before Type, but compact Axys tokens commonly
# place Type before Symbol. PPAR follows that convention, so csus + AAPL becomes
# csusAAPL. Axys/APX security types are typically four characters; PPAR retains
# the source value without imposing a length restriction.
security_id:
  components:
    - "Security Type"
    - "Security Symbol"
  # Optional. Omit for compact Axys/APX identifiers. A site may instead use:
  # separator: "_"

portfolio_performance_columns:
