  portfolio_name: "Portfolio Name"
  from_date: "From Date"
  thru_date: "Thru Date"
  portfolio_return: "Portfolio Return"
  begin_market_value: "Beginning Market Value"
  end_market_value: "Ending Market Value"
  flow: "Net Flow"
  income: "Income"
  gain_loss: "Gain/Loss"
  base_currency: "Base Currency"

