  transactions.csv:
    extraction_requirements:
      dataset: required
      reason: Dated, classified amounts are needed to explain changed external flows, income, fees, and security
        activity.
      likely_source: IMEX transaction export first; use REP/custom output or another reviewed source when IMEX omits
        transaction-semantics context.
      required:
      - Portfolio Code
      - Transaction Date
      - Security Symbol
      - Security Type
      - Transaction Code
      - Amount
      required_only_when_applicable:
        Transaction Security Type: Required by the packaged guard when ambiguous DP, LI, LO, TI, or WD codes can
          appear.
        Source/Destination Type: Required by the packaged guard when ambiguous DP, LI, LO, TI, or WD codes can appear.
        Source/Destination Symbol: Required by the packaged guard when ambiguous DP, LI, LO, TI, or WD codes can
          appear.
        Special Security Type: Required by the packaged guard when ambiguous DP, LI, LO, TI, or WD codes can appear.
        Special Security Symbol: Required by the packaged guard when ambiguous DP, LI, LO, TI, or WD codes can appear.
        Currency Code: Required for transaction amounts stated in a currency other than portfolio base currency.
        Base Currency: Required for multi-currency portfolios unless the authoritative portfolio-performance row
          supplies it.
        Base Amount: Required when AMOUNT is local-currency rather than the portfolio-base amount used by the
          performance calculation.
      optional:
      - Settlement Date
      - Quantity
      - Price
      - Commission
    columns:
      Portfolio Code:
        normalized_meaning: Portfolio/account identifier.
        imex_confidence: high
        rep_confidence: high
        comments: Core transaction/account field.
        basis: Transaction import/export and report evidence in Chapter_05_Transactions.md, Chapter_12_Imex.md,
          and Chapter_13_Rep.md.
        open_questions:
        - Confirm exact posted-transaction export fields and sign convention.
        candidate_axys_names:
        - PORT
        - Portfolio
        - Account
        candidate_report_labels:
        - Portfolio
        - Account
        name_confidence: inferred_alias
        name_notes: Candidate aliases only; confirm against the local IMEX profile, REP output, or vendor field
          dictionary.
        preferred_source: imex_then_rep_cross_check
        fallback_source: rep_preferred
        requires_context_for_semantics: false
