        preferred_source: imex_or_rep
        fallback_source: rep_preferred
        requires_context_for_semantics: false
        blocking_if_missing: true
        source_strategy_notes: Holdings reconstruction can use either validated position/appraisal IMEX output or
          an appraisal-style REP extract.
      Accrued Income:
        normalized_meaning: Accrued income or accrued interest.
        imex_confidence: medium
        rep_confidence: medium
        comments: Common for fixed-income holdings, but exact export/report field requires validation.
        basis: Fixed-income/accrual handling is documented as performance-sensitive; common-core holdings reference
          treats accrued income as plausible.
        open_questions:
        - Confirm accrued-income field, date basis, and fixed-income treatment.
        candidate_axys_names:
        - ACCRUED
        - Accrued Interest
        - Accrued Income
        candidate_report_labels:
        - Accrued Interest
        - Accrued Income
        name_confidence: report_label_inferred
        name_notes: Report-style label candidates are more credible than native IMEX names for this field.
