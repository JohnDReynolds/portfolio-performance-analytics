version: 1
scope:
  snapshots:
  - snapshot_a
  - snapshot_b
  purpose: 'Every packaged comparison demo CSV column must have an explicit IMEX/REP availability confidence decision.

    '
confidence_labels:
  high: Strongly likely to be obtainable from a typical Axys/APX environment.
  medium_high: Between medium and high; likely available, but still report/profile dependent.
  medium: Plausible, but site configuration, report choice, or export profile must be validated.
  medium_unknown: Between medium and unknown; evidence mentions the area, but not the exact object/field.
  low_medium: Between low and medium; possible and plausible, but not proven as a standard field.
  low: Possible through customization or site-specific configuration, but not enough to rely on.
  unknown: Not established by the local Axys/APX reference corpus.
normalized_multicurrency_defaults:
  imex_confidence: unknown
  rep_confidence: low_medium
  comments: Normalized PPAR multi-currency demo field; exact Axys/APX source and label require local validation.
  basis: The research supports multi-currency concepts but does not prove this exact export field or normalized
    layout.
  open_questions: &id001
  - Confirm the local source, field label, currency basis, and date semantics.
  candidate_axys_names:
  - Currency-related local field
  candidate_report_labels:
  - Currency-related report field
  name_confidence: inferred_alias
  name_notes: Normalized demo name only; confirm the exact local Axys/APX label.
  preferred_source: local_discovery_required
  fallback_source: rep_preferred
  requires_context_for_semantics: false
  blocking_if_missing: true
  source_strategy_notes: Validate the local extract and currency basis against a report sample before use.
datasets:
  holdings.csv:
    extraction_requirements:
      dataset: required
      reason: Beginning and ending base-currency values provide the Modified Dietz valuation inputs used to explain
        a changed return.
      likely_source: IMEX positions/holdings export or a REP appraisal report.
      required:
      - Portfolio Code
      - Security Symbol
      - Security Type
      - Holding Date
      - Market Value
      required_only_when_applicable:
        Currency Code: Required for holdings whose local currency differs from the portfolio base currency.
        Base Currency: Required for multi-currency portfolios unless a validated portfolio-level source supplies
          it.
        Base Market Value: Required when MKT_VAL is local-currency rather than portfolio-base value.
        Accrued Income: Required when accrued income is stated separately from MKT_VAL and affects beginning or
          ending value.
      optional:
      - Quantity
      - Price
    columns:
      Portfolio Code:
        normalized_meaning: Portfolio/account identifier.
        imex_confidence: high
        rep_confidence: high
        comments: Core portfolio/client identifier in position and appraisal workflows.
        basis: Position/appraisal evidence in Chapter_06_Holdings.md, Chapter_12_Imex.md, Chapter_13_Rep.md, and
          axys_apx_common_core_export.md.
        open_questions:
        - Confirm exact local IMEX profile and field name.
        candidate_axys_names:
        - PORT
        - Portfolio
        - Portfolio Code
        - Account
        candidate_report_labels:
        - Portfolio
        - Account
        name_confidence: inferred_alias
        name_notes: Candidate aliases only; confirm against the local IMEX profile, REP output, or vendor field
          dictionary.
        preferred_source: imex_or_rep
        fallback_source: rep_preferred
        requires_context_for_semantics: false
        blocking_if_missing: true
        source_strategy_notes: Holdings reconstruction can use either validated position/appraisal IMEX output or
          an appraisal-style REP extract.
      Security Symbol:
        normalized_meaning: Security identifier.
        imex_confidence: high
        rep_confidence: high
        comments: Security identifiers are supported by CI/security-resolution and report evidence.
        basis: Position/appraisal evidence in Chapter_06_Holdings.md, Chapter_12_Imex.md, Chapter_13_Rep.md, and
          axys_apx_common_core_export.md.
        open_questions:
        - Confirm exact local IMEX profile and field name.
        candidate_axys_names:
        - SEC
        - Security
        - Symbol
        - Security ID
        candidate_report_labels:
        - Security
        - Symbol
        - Security ID
        name_confidence: inferred_alias
        name_notes: Candidate aliases only; confirm against the local IMEX profile, REP output, or vendor field
          dictionary.
        preferred_source: imex_or_rep
        fallback_source: rep_preferred
        requires_context_for_semantics: false
        blocking_if_missing: true
        source_strategy_notes: Holdings reconstruction can use either validated position/appraisal IMEX output or
          an appraisal-style REP extract.
      Security Type:
        normalized_meaning: Security-type component paired with Security Symbol to construct PPAR security_id.
        imex_confidence: high
        rep_confidence: medium
        comments: Symbol alone is not unique; the reviewed type/symbol pair defines source security identity.
        basis: Chapter_04_Security_Master.md and Research_04_Security_Master.md verify security-type exports and
          mixed-case examples in integration workflows.
        open_questions:
        - Confirm the local security-type field, value dictionary, case rules, and version applicability.
        candidate_axys_names:
        - SECURITY_TYPE
        - SEC_TYPE
        - Security Type
        - Sec Type Code
        - Type
        candidate_report_labels:
        - Security Type
        - Sec Type
        - Type
        name_confidence: inferred_alias
        name_notes: Candidate aliases and labels are workflow evidence, not a complete native field dictionary.
        preferred_source: imex_then_rep_cross_check
        fallback_source: rep_preferred
        requires_context_for_semantics: false
        blocking_if_missing: true
        source_strategy_notes: Preserve the exact source value and validate the site-specific code dictionary before
          filtering.
      Holding Date:
        normalized_meaning: As-of date for holdings.
        imex_confidence: high
        rep_confidence: high
        comments: Position exports and appraisal reports are inherently as-of-date based.
        basis: Position/appraisal evidence in Chapter_06_Holdings.md, Chapter_12_Imex.md, Chapter_13_Rep.md, and
          axys_apx_common_core_export.md.
        open_questions:
        - Confirm exact local IMEX profile and field name.
