  imex_preferred: Use IMEX first when the local profile exposes the field.
  rep_preferred: Use REP/report output first because report-tie behavior matters.
  imex_or_rep: Either IMEX or REP is acceptable after local field validation.
  imex_then_rep_cross_check: Use IMEX as the primary feed and REP as a report-output cross-check.
  local_discovery_required: Do not assume a source; validate local IMEX/REP/custom-report support first.
