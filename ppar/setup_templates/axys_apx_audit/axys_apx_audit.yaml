# =================================
# PPAR Axys/APX Audit Configuration
# =================================
# This file has been copied to your setup folder as audit/ppar.yaml.
#
# The default command to run Audit is:
#   ppar audit ./my_ppar_data/audit
#
# Audit has two complementary results:
# - Performance Comparison answers: "Why did my reported performance change?"
# - Data Issues answers: "Are there suspicious source-data inconsistencies?"
# PPAR writes both
# portfolio and security reports when secperf.csv is available in both snapshots.
#
# To customize with your own data:
# 1. Replace the CSV files in the snapshot_a directory with your own
#    older/original IMEX/REP files.
# 2. Replace the CSV files in the snapshot_b directory with your own
#    newer/restated IMEX/REP files.
# 3. If snapshot folder names or filenames differ, edit snapshots.*.path or
#    files.* below.
# 4. If column names differ, edit column_mappings.yaml.
# 5. Run ppar audit ./my_ppar_data/audit again and review the outputs.
# 6. Ambiguous transaction codes must not become external flows or other
#    financial meanings without reviewed local evidence.
#    Leave the starter transaction rules and impact methods unchanged unless that
#    evidence supports an override.

audit:
  # Command-line values override YAML values. Every setting below has a default
  # and may be omitted.

  # Folder that receives both portfolio and security report bundles. A YAML
  # relative path is anchored to this audit folder; PPAR creates it when needed.
  # Default: output
  # Command-line override: --output-directory ./review_output
  output_directory: output

  # Shared visible report title. Keep this null to use the standard Portfolio
  # Audit Report and Security Audit Report titles.
  # Default: None (use the standard level-specific titles)
  # Command-line override: --title "Quarter-end Audit"
  title: null

  # Whether to write each level-specific XLSX workbook.
  # Default: true
  # Command-line override: --no-xlsx-output
  xlsx_output: true

  # Whether to write each level-specific browser review report.
  # Default: true
  # Command-line override: --no-html-output
  html_output: true

  # Whether findings suppressed by the rules below are omitted from reports.
  # Source-data is still processed when suppressed findings are omitted.
  # Default: false
  # Command-line override: --exclude-suppressed
  exclude_suppressed: false

  # Whether detailed return-reconstruction diagnostics are added to reports and
  # supporting artifacts.
  # Default: false
  # Command-line override: --reconstruction-diagnostics
  reconstruction_diagnostics: false

  # Whether supporting CSV and JSON files are written individually instead of
  # in audit_support.zip. source_detail.csv always remains at the report root.
  # Default: false
  # Command-line override: --expand-all-supporting-files
  expand_all_supporting_files: false

  # Whether changed periods must have the YAML setup required by a supported
  # causal explanation method. This does not require every difference to be
  # fully explained.
  # Default: false
  # Command-line override: --require-causal-attribution
  require_causal_attribution: false

snapshots:
  # Required. A snapshot is one complete set of source CSVs.
  #
  # snapshot_a:
  #   Usually the original/older source-data extract.
  #
  # snapshot_b:
  #   Usually the newer/restated source-data extract.
  #
  # label:
  #   User-facing label used in reports.
  #
  # path:
  #   Folder containing the snapshot IMEX/REP CSV files. Keep paths relative to
  #   this YAML so the setup folder can move as one unit.
  #
  # schema:
  #   Points to the explicit source-column mapping file copied with this setup.
  a:
    label: snapshot_a
    path: snapshot_a
    schema: column_mappings.yaml

  b:
    label: snapshot_b
    path: snapshot_b
    schema: column_mappings.yaml

files:
  # The three labels below are deliberately narrow:
  #   Required: needed to make Fully Explained possible in the ordinary
  #     portfolio comparison.
  #   Required only when applicable: needed only for the named feature or data
  #     condition, such as security comparison, multi-currency, separately
  #     stated accrued income, or ambiguous transaction codes.
  #   Optional: safe to omit; its absence alone does not prevent Fully
  #     Explained.
  #
  # Required datasets use the standard filenames below when their key is
  # omitted. Genuinely optional evidence remains explicit so merely placing a
  # file in a snapshot cannot change comparison findings or accounting policy.
  # Override only the filenames that differ at your site.
  #
  # Currency naming rule:
  #   In holdings and transactions, an unqualified monetary field is in
  #   the row CURRENCY. A BASE_ field is the translated value in portfolio
  #   BASE_CURRENCY. Portfolio/security performance monetary fields are
  #   inherently in portfolio BASE_CURRENCY and therefore stay unprefixed.
  #   FX_RATE is TO_CURRENCY units per one FROM_CURRENCY unit. Do not introduce
  #   LOCAL_ duplicates; row currency is already the detailed-data default.
  #   Currency codes must be three letters. Foreign countable values require
  #   their BASE_ counterpart, and portfolio FX quotes must target the portfolio
  #   BASE_CURRENCY.
  #   Cash is represented only as holdings such as CASHUSD, CASHEUR, or
  #   CASHGBP; there is no separate cash dataset.
  #
  # portfolio_performance:
  #   Required fields: PORTFOLIO_CODE, FROM_DATE, THRU_DATE, PORT_RETURN.
  #   Required only when applicable: BASE_CURRENCY for multi-currency work. It
  #   is authoritative when supplied; PPAR fills missing holdings/transaction
  #   base currency from it and rejects contradictory row values.
  #   Optional fields: BEGIN_MV, END_MV, FLOW, INCOME, GAIN_LOSS. They are
  #   compared when present but are not needed for Fully Explained.
  #   Likely source: REP performance report. The current evidence does not
  #   verify a native performance IMEX object.
  #   Default: portperf.csv
  portfolio_performance: portperf.csv

  # security_performance:
  #   Required only when applicable: the file is needed for security-level
  #   comparison, with Portfolio Code, Security Symbol, Security Type, From
  #   Date, Thru Date, and Security Return. It is not needed for portfolio-only
  #   audit. PPAR constructs security_id by concatenating Security Type and
  #   Security Symbol, for example csusAAPL.
  #   Optional fields: BEGIN_MV, END_MV, BEGIN_WEIGHT, INCOME, GAIN_LOSS, and
  #   CONTRIBUTION. They are compared when present.
  #   Likely source: REP security-performance or attribution report. The
  #   current evidence does not verify a native performance IMEX object.
  #   Default for the security report: secperf.csv. Security reporting is
  #   skipped when it is unavailable in either snapshot.
  security_performance: secperf.csv

  # holdings:
  #   Required fields: Portfolio Code, Security Symbol, Security Type, Holding
  #   Date, and Market Value, with rows for the beginning and ending dates of
  #   every comparison period.
  #   Required only when applicable: CURRENCY, BASE_CURRENCY, and BASE_MKT_VAL
  #   for multi-currency holdings; ACCRUED when it is stated separately from
  #   MKT_VAL and affects valuation; BASE_ACCRUED when a nonzero foreign
  #   ACCRUED value participates in Modified Dietz.
  #   Optional fields: QTY and PRICE.
  #   Likely source: IMEX positions/holdings export or REP appraisal report.
  #   Default when required by configured reconstruction: holdings.csv.
  holdings: holdings.csv

  # transactions:
  #   Required fields: Portfolio Code, Transaction Date, Security Symbol,
  #   Security Type, Transaction Code, and Amount.
  #   Required only when applicable: Transaction Security Type,
  #   Source/Destination Type, Source/Destination Symbol, Special Security Type,
  #   and Special Security Symbol when ambiguous DP, LI, LO, TI, or WD codes can
  #   appear; Currency Code, Base Currency, and Base Amount for foreign amounts.
  #   Optional fields: SETTLE_DATE, QTY, PRICE, COMMISSION.
  #   Likely source: IMEX transaction export. Use REP/custom output or another
  #   reviewed source if IMEX omits the context needed for ambiguous codes.
  #   Default when required by configured reconstruction: transactions.csv.
  transactions: transactions.csv

  # security_reference:
  #   Required only when applicable: configure this file when a Data Issues
  #   only/exclude filter uses a security_reference.* qualifier. Security Symbol
  #   and Security Type are required; their constructed security_id must be
  #   unique with exact source case. Classification fields such as Asset Class
  #   Code are optional until referenced.
  #   Likely source: IMEX security-information export, a security-master report,
  #   or another reviewed security-reference extract.
  #   Default when required by a configured reference filter: secmast.csv.
  security_reference: secmast.csv

  # fx_rates:
  #   Required only when applicable: to explain a changed FX rate itself, use
  #   PORT, FROM_CURRENCY, TO_CURRENCY, RATE_DATE, FX_RATE, and LOCAL_EXPOSURE.
  #   RATE_SOURCE and RATE_TYPE are required only when pair/date alone does not
  #   identify one controlled series. Otherwise this entire file is optional.
  #   Likely source: local discovery is required; use a validated REP extract,
  #   FX/price source, or other controlled rate source.
  #   Default: None (optional evidence must be configured explicitly).
  fx_rates: fx_rates.csv

  # splits:
  #   Optional fields: Security Symbol, Security Type, Split Date, and Split
  #   Factor. Split factors can explain a quantity change, but they do not
  #   directly enter the current Modified Dietz explanation formula.
  #   Likely source: split.inf or a local split-factor export; REP/custom output
  #   only if it exposes equivalent factors.
  #   Default: None (optional evidence must be configured explicitly).
  splits: splits.csv

# The packaged source contract is versioned and the demo rules intentionally
# match transaction codes and native context identifiers by exact case. Existing
# site configurations that omit this setting retain legacy case-insensitive
# semantics until their source contract is reviewed and versioned.
extract_contract:
  enforce_ambiguous_axys_flows: true
  transaction_semantics_case: exact

data_issues:
  # Purpose:
  #   Writes the "Data Issues" worksheet. These checks are independent
  #   consistency checks across the union of Snapshot A and Snapshot B. They do
  #   not change Performance Difference Explained and they are not Source Detail
  #   rows.
  #   Prior-ending/next-beginning market-value continuity is a mandatory safety
  #   check and remains visible even if optional checks below are disabled.
  #
  # Review philosophy:
  #   Start narrow. Add only/exclude filters and tolerances before using broad
  #   checks on production extracts. The demo below intentionally focuses on a
  #   few securities so the worksheet remains readable.
  #
  # Filtering:
  #   Established issue types are on by default. Conservative opt-in checks
  #   explicitly say so below and require a narrow only population. Set
  #   enabled: false under an established check to turn it off. Use only/exclude
  #   for simple exact-match filters. Field names may be common names such as
  #   security_id and portfolio_id, or dataset.field names such as
  #   holdings.security_type and transactions.transaction_code.
  enabled: true

  holdings_nonpositive_price:
    # Flags a nonzero holding with a zero or negative price. Product default:
    # disabled. This starter enables a narrowly scoped demo population.
    # Worthless securities, cash, accrued-only rows, shorts, derivatives, and
    # site-specific valuation conventions can be legitimate exclusions. The
    # fixed condition does not accept tolerance settings.
    enabled: true
    only:
      security_id:
        - csusMSFT
      security_reference.asset_class_code: EQ

  holdings_price_range:
    # Checks same-day same-security holdings.price values across portfolios.
    # Closing/as-of holdings prices should usually match tightly unless the
    # extract intentionally includes portfolio-specific valuation overrides.
    enabled: true
    only:
      security_id:
        - csusAAPL
    absolute_tolerance: 0.01
    percent_tolerance: 0.05

  holdings_stale_price:
    # Flags the same positive price observed across supplied holding dates for
    # at least the configured number of calendar days. It does not claim PPAR
    # observed every intervening market day. The demo preserves the real GOOGL
    # market-value baseline but injects its 2025-12-31 price into ALPHA's
    # 2026-01-30 PRICE field in both snapshots as an isolated source anomaly.
    enabled: true
    only:
      security_id:
        - csusGOOGL
      security_reference.security_type: csus
    minimum_calendar_days: 28

  large_price_variation:
    # Combines beginning/end boundary holdings prices with eligible intra-period
    # transaction prices, split-normalizes them to the period-ending share
    # basis, and reports one maximum variation per rule/security/period. Rules
    # are independently identified so overlapping populations remain visible.
    # This demo rule uses the real AVGO observations and a configured 20 percent
    # decimal tolerance. Transaction-code filtering applies only to transaction
    # observations; the two boundary holdings observations remain eligible.
    enabled: true
    rules:
      - rule_id: common_stock_20_percent
        only:
          security_id:
            - csusAVGO
          transactions.transaction_code:
            - by
            - sl
          security_reference.security_type: csus
        minimum_calendar_days: 1
        minimum_tolerance: 0.20

  transactions_price_range:
    # Checks same-day same-security transactions.price values across
    # portfolios. Intraday trades can naturally occur at different prices, so
    # this tolerance is normally wider than the holdings.price tolerance.
    enabled: true
    only:
      security_id:
        - csusAAPL
      transactions.transaction_code:
        - by
    absolute_tolerance: 0.01
    percent_tolerance: 0.05

  transactions_nonpositive_price:
    # Flags a nonzero-quantity transaction with a zero or negative price.
    # Product default: disabled. This starter enables a narrowly scoped demo
    # population. It does not infer that a transaction code is universally
    # price-bearing. The fixed condition does not accept tolerance settings.
    enabled: true
    only:
      security_id:
        - csusKO
      transactions.transaction_code:
        - by
      security_reference.security_type: csus

  transaction_security_type_mismatch:
    # Compares the transaction row's exact-case security type with the reviewed
    # snapshot security reference. The demo's uppercase CSUS value differs only
    # by case; PPAR reports both values without choosing which one is correct.
    # Product default: disabled. This starter enables an explicit reference-type
    # demo population. The check does not accept tolerance settings.
    enabled: true
    only:
      security_id:
        - csusKO
      security_reference.security_type: csus

  deliver_in_original_cost_incomplete:
    # Optional site-specific example. The primary demo deliberately omits the
    # original-cost amount/date input columns because Performance Comparison
    # does not require them. Before enabling this check, add both columns to
    # both snapshot transaction extracts. The check does not classify ti from
    # code alone, calculate cost basis, or conclude that Axys used a fallback.
    enabled: false
    only:
      transactions.transaction_code: ti
      transactions.security_type: csus
      transactions.source_destination_type: $pty
      transactions.source_destination_symbol: external_delivery

  duplicate_transactions:
    # Checks exact duplicate transaction rows. This is a simple source-data
    # hygiene check: the same portfolio, date, security, code, amount,
    # quantity, and price should not usually appear more than once unless the
    # extract has another durable identifier proving they are separate events.
    enabled: true
    only:
      security_id:
        - csusKO

  dividend_rate:
    # Checks same-day same-security dividend amount per share across
    # portfolios. When transactions.quantity is blank or zero, PPAR uses the
    # next same-portfolio holdings.quantity on or after the dividend date.
    enabled: true
    only:
      security_id:
        - csusJPM
    absolute_tolerance: 0.01
    percent_tolerance: 0.5

  missing_dividend:
    # Flags a portfolio that appears to hold a stock through a dividend date
    # while another portfolio has a same-day dividend for that stock. The rule
    # is intentionally conservative: the portfolio must have a positive
    # beginning-period quantity or positive buy activity before the dividend
    # date, and it must have no pre-dividend transaction activity other than
    # buys.
    enabled: true
    only:
      security_id:
        - csusAAPL

  pa_sa_rate:
    # Checks same-day same-security purchase-accrued/sale-accrued rates across
    # portfolios. As with dividends, PPAR uses transaction quantity when
    # available and otherwise falls back to holdings quantity.
    enabled: true
    only:
      security_id:
        - fius91282Y5Y1
      security_reference.asset_class_code: FI
    absolute_tolerance: 0.000001
    percent_tolerance: 0.5

  holdings_accrued_rate:
    # Checks same-day same-security holdings.accrued per unit. Use a small
    # tolerance because real extracts often carry harmless fractional rounding.
    enabled: true
    only:
      security_id:
        - fius91282Y5Y1
      security_reference.asset_class_code: FI
    absolute_tolerance: 0.00001
    percent_tolerance: 0.5

portfolio_return_reconstruction:
  # Purpose:
  #   Defines how PPAR reconstructs portfolio returns from source data. This is
  #   the mathematical basis for deciding whether a source-data change explains
  #   a reported portfolio return change.
  #
  # Method:
  #   modified_dietz is the supported onboarding method. It uses beginning
  #   value, ending value, and weighted external flows.
  #
  # Source choices:
  #   beginning_value_source and ending_value_source normally stay holdings.
  #   flow_source normally stays transactions.
  #
  # Timing:
  #   flow_timing names the transaction date field used to weight external
  #   flows. day_count actual_days means calendar-day weighting. inclusion_rule
  #   beginning_of_day means a flow on the first day receives full-period
  #   weighting.
  #
  # Categories:
  #   flow_categories are transaction categories treated as investor external
  #   flows. income_categories are performance-impacting but not investor
  #   external flows.
  #
  # Sign convention:
  #   signed_amount means cash-flow direction is expressed by the signed
  #   transaction amount after transaction_rules are applied.
  method: modified_dietz
  beginning_value_source: holdings
  ending_value_source: holdings
  flow_source: transactions
  flow_timing: transaction_date
  day_count: actual_days
  inclusion_rule: beginning_of_day
  flow_categories:
    - external_flow
  income_categories:
    - income
    - fee_expense
  return_basis: net
  sign_convention: signed_amount

security_return_reconstruction:
  # Purpose:
  #   Defines security-level return reconstruction when secperf.csv is present.
  #
  # Important distinction:
  #   Buys and sells are security-level flows because they change capital
  #   allocated to a security. They are not portfolio-level investor external
  #   flows.
  #
  # Keep this section aligned with portfolio_return_reconstruction unless your
  # site has reviewed evidence that security-level reporting uses different
  # timing or day-count rules.
  method: modified_dietz
  beginning_value_source: holdings
  ending_value_source: holdings
  flow_source: transactions
  flow_timing: transaction_date
  day_count: actual_days
  inclusion_rule: beginning_of_day
  flow_categories:
    - buy
    - sell
  income_categories:
    - income
    - fee_expense
  return_basis: net
  sign_convention: signed_amount

transaction_rules:
  # Purpose:
  #   Maps Axys/APX transaction codes to performance-comparison categories.
  #   This is usually the most site-specific part of onboarding.
  #
  # How to read one rule:
  #   transaction_category tells PPAR what the row means.
  #   cash_flow_sign tells PPAR whether the amount is positive, negative, none,
  #   or already signed.
  #   performance_flow_sign tells PPAR whether the row is an external flow,
  #   performance-impacting activity, or neutral context.
  #
  # Common transaction_category values:
  #   buy, sell, income, fee_expense, external_flow, transfer,
  #   corporate_action.
  #
  # Common cash_flow_sign values:
  #   positive, negative, none.
  #
  # Common performance_flow_sign values:
  #   external, performance, neutral.
  #
  # Conditional rules:
  #   A code can have multiple rules with when: clauses. PPAR uses context such
  #   as security type, special-security fields, source/destination type, or
  #   cash security identifiers to avoid overclassifying ambiguous codes.
  #
  # Site onboarding rule:
  #   Add site overrides only after validation shows an observed code that needs
  #   treatment and the source data proves how that code affects Modified Dietz
  #   inputs.
  #
  # Starter transaction coverage:
  #   by, sl, dv, and in are the common first-pass rules. dp, li, lo, and wd
  #   require the context shown below before PPAR treats them as fees,
  #   transfers, or external flows. pa and sa require fixed-income context. rc
  #   requires explicit return-of-capital context. pd requires amortizing
  #   fixed-income/MBS/ABS principal-paydown context and is modeled as a
  #   security-level principal flow, not an investor external flow.
  #   ai requires the packaged margin/security context. ti requires the cited
  #   deliver-in workflow plus external-party and equity-security context.
  #   ss and cs are included only for the controlled synthetic short-side demo.
  #   The demo assumes lowercase ss/cs, real equity prices, no client external
  #   flow, and cash/proceeds treatment visible in the source rows. Production
  #   sites should confirm local short-cash and position-sign conventions before
  #   relying on these rules.
  #   Keep ";" as a defensive corporate-action/journal guardrail.
  #   Override it only when a real event and reviewed local policy support a
  #   more specific treatment.
  by:
    transaction_category: buy
    cash_flow_sign: negative
    performance_flow_sign: performance
  sl:
    transaction_category: sell
    cash_flow_sign: positive
    performance_flow_sign: performance
  ss:
    - when:
        security_type: csus
        source_destination_type: awus
        source_destination_symbol: none
      transaction_category: sell
      cash_flow_sign: positive
      performance_flow_sign: performance
  cs:
    - when:
        security_type: csus
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: buy
      cash_flow_sign: negative
      performance_flow_sign: performance
  dv:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  # Net-of-fees assumption: fee changes are performance-impacting only when the
  # reported returns are net of fees. If your site reports gross-of-fees returns,
  # review this rule before relying on fee_expense treatment.
  dp:
    - when:
        special_security_type: exus
        special_security_symbol: custfee
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
    - when:
        special_security_type: epus
        special_security_symbol: with
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
  ai:
    # Margin interest is performance expense only with the reviewed margin
    # security and source context used by this site-scoped demo. Code-only ai
    # remains unknown.
    - when:
        security_type: caus
        source_destination_type: $pth
        source_destination_symbol: $cash
        special_security_type: caus
        special_security_symbol: margin
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
  in:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  rc:
    # Return of capital is included only with an equity security type and the
    # documented portfolio-cash destination context. The public translation
    # row leaves Special Security Type / Symbol blank. Do not promote code-only
    # rc rows; native cost-basis handling remains outside Modified Dietz.
    - when:
        security_type: csus
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: income
      cash_flow_sign: positive
      performance_flow_sign: performance
    - when:
        security_type: csus
      transaction_category: corporate_action
      cash_flow_sign: none
      performance_flow_sign: neutral
  pd:
    # Principal paydown is included only with amortizing security context and
    # portfolio cash destination evidence. The public translation row leaves
    # Special Security Type / Symbol blank. The existing security-level
    # reconstruction engine treats this as a sell-like principal flow because
    # principal leaves the security and cash returns to the portfolio. Do not
    # promote code-only pd rows; quantity may be zero or unchanged.
    - when:
        security_type: fius
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: sell
      cash_flow_sign: positive
      performance_flow_sign: performance
  pa:
    # Purchase accrued interest is a fixed-income trade adjunct, not an
    # investor external flow. Use this only when the transaction row has
    # explicit bond/fixed-income context.
    - when:
        security_type: fius
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
  sa:
    # Sale accrued interest is a fixed-income trade adjunct, not an investor
    # external flow. Use this only when the transaction row has explicit
    # bond/fixed-income context.
    - when:
        security_type: fius
      transaction_category: income
      cash_flow_sign: positive
      performance_flow_sign: performance
  li:
    # Long-in is external only with reviewed external-party context; internal
    # account movement remains neutral transfer.
    - when:
        source_destination_type: $pty
      transaction_category: external_flow
      cash_flow_sign: positive
      performance_flow_sign: external
    - when:
        source_destination_type: $acct
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral
  ti:
    # This rule models one cited deliver-in workflow, not universal ti
    # semantics. External treatment requires both external-party and equity
    # security context; other ti rows remain unknown pending local review.
    - when:
        security_type: csus
        source_destination_type: $pty
        source_destination_symbol: external_delivery
      transaction_category: external_flow
      cash_flow_sign: positive
      performance_flow_sign: external
  lo:
    # Long-out is external only with reviewed external-party context; internal
    # account movement remains neutral transfer.
    - when:
        source_destination_type: $pty
      transaction_category: external_flow
      cash_flow_sign: negative
      performance_flow_sign: external
    - when:
        source_destination_type: $acct
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral
  ";":
    # Reserved corporate-action/journal marker. Normal Axys split evidence is
    # better modeled through the separate splits.csv factor extract. Use this
    # only when a local site or conversion process materializes corporate-action
    # markers in transaction rows.
    transaction_category: corporate_action
    cash_flow_sign: none
    performance_flow_sign: neutral
  wd:
    # Withdrawal is external only for a cash row with reviewed external-party
    # context; sweep-like rows remain neutral transfer.
    - when:
        security_id: causCASHUSD
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: external_flow
      cash_flow_sign: negative
      performance_flow_sign: external
    - when:
        source_destination_type: $sweep
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral

transaction_impact_methods:
  # Purpose:
  #   Explains how changed transaction rows are converted into basis-point
  #   performance impact rows in the report.
  #
  # external_flow:
  #   Uses Modified Dietz weighting because investor external flows change the
  #   return denominator.
  #
  # performance:
  #   Uses transaction amount delta over the return denominator for items such
  #   as income and fee expense.
  #
  # double_count_policy cross_check_only:
  #   Keeps flow rows available for review without double-counting the same
  #   source-data change as multiple additive causes.
  external_flow:
    method: modified_dietz
    flow_timing: trade_date
    day_count: actual_days
    inclusion_rule: beginning_of_day
    denominator_source: begin_market_value
    double_count_policy: cross_check_only
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value
  quantity:
    method: evidence_only
  price:
    method: evidence_only
  commission:
    method: evidence_only

security_return_impact_methods:
  # Purpose:
  #   Explains changed security-level transaction rows when security reports are
  #   generated. For security Modified Dietz, buys and sells are treated as
  #   security-level flows using transaction dates.
  transactions:
    method: modified_dietz
    flow_timing: transaction_date
    day_count: actual_days
    inclusion_rule: beginning_of_day

holding_impact_methods:
  # Explicit policies replace formerly implicit calculation defaults.
  market_value:
    method: market_value_delta_over_return_denominator
    denominator_source: begin_market_value
  accrued:
    method: accrued_delta_over_return_denominator
    denominator_source: begin_market_value
  quantity:
    method: quantity_delta_times_snapshot_a_unit_market_value_over_return_denominator
    denominator_source: begin_market_value
  cost:
    method: evidence_only

price_impact_methods:
  price:
    method: price_delta_over_snapshot_a_price_times_weight
    weight_source: snapshot_a_weight

fx_rate_impact_methods:
  fx_rate:
    method: evidence_only

evidence_only_impact_methods:
  # Purpose:
  #   Names source-data fields that are intentionally review context, not
  #   additive Modified Dietz causes. Split factors explain why holdings
  #   quantities changed, but the actual performance input remains the ending
  #   holding value. FX rates support changed base-currency values; the changed
  #   holdings.base_market_value or transactions.base_amount row is counted.
  splits:
    method: evidence_only
    source_fields:
      - split_factor
  fx_rates:
    method: evidence_only
    source_fields:
      - fx_rate

tolerances:
  # Purpose:
  #   Suppresses immaterial rounding noise. Tighten only if your extracts are
  #   consistently more precise; loosen only when source-system rounding creates
  #   harmless noise.
  #
  # return/contribution/weight are decimal units. market_value is currency units.
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
  quantity: 0.000001
  price: 0.000001
  split_factor: 0.00000001
  fx_rate: 0.00000001
