# ==============================================================================
# PPAR Axys/APX Audit Configuration
# ==============================================================================
# This file has been copied to your setup directory as audit/ppar.yaml.
#
# The default command to run Audit is:
#   ppar audit ./my_ppar_data/audit
#
# To customize with your own data:
# 1. Replace the CSV files in the snapshot_a directory with your own
#    older/original source files.
# 2. Replace the CSV files in the snapshot_b directory with your own
#    newer/restated source files.
# 3. If snapshot directory names differ, edit snapshots.*.path below.
# 4. If CSV filenames or column names differ, edit files.*.path or
#    files.*.columns below.
# 5. Run ppar audit ./my_ppar_data/audit again and review the outputs.
# 6. Ambiguous transaction codes must not become external flows or other
#    financial meanings without reviewed local evidence. Leave the transaction
#    rules and impact methods below unchanged unless that evidence supports an
#    override.

# ==============================================================================
# Audit Runtime Parameters
# ==============================================================================
audit:
  # Command-line values override the YAML values below. Every setting has a
  # documented default and may be omitted.

  # Directory where the output files are written. A relative path is anchored
  # to this audit directory; PPAR creates it when needed.
  # Default: output
  # Command-line override: --output-directory ./review_output
  output_directory: output

  # Optional title used for both portfolio and security reports.
  # Default: "Portfolio Audit Report" and "Security Audit Report", respectively
  # Command-line override: --title "Quarter-end Audit"
  title: null

  # Whether to write XLSX workbooks.
  # Default: true
  # Command-line override: --no-xlsx-output
  xlsx_output: true

  # Whether to write HTML reports.
  # Default: true
  # Command-line override: --no-html-output
  html_output: true

  # Whether findings suppressed by the rules below are omitted from reports.
  # Source-data is still processed when suppressed findings are omitted.
  # Default: false
  # Command-line override: --exclude-suppressed
  exclude_suppressed: false

  # Whether detailed return-reconstruction diagnostics are added to reports and
  # supporting artifacts.
  # Default: false
  # Command-line override: --reconstruction-diagnostics
  reconstruction_diagnostics: false

  # Whether supporting CSV and JSON files are written individually instead of
  # in audit_support.zip. source_detail.csv is always written at the report
  #   root.
  # Default: false
  # Command-line override: --expand-all-supporting-files
  expand_all_supporting_files: false

  # Whether changed periods must have the YAML setup required by a supported
  # causal explanation method. This does not require every difference to be
  # fully explained.
  # Default: false
  # Command-line override: --require-causal-attribution
  require_causal_attribution: false

# ==============================================================================
# Audit Snapshots
# ==============================================================================
snapshots:
  # Required. A snapshot is one complete set of source CSV files.
  #
  # snapshot_a:
  #   Usually the original/older source-data extract.
  #
  # snapshot_b:
  #   Usually the newer/restated source-data extract.
  #
  # label:
  #   User-facing label used in reports.
  #
  # path:
  #   Directory containing the snapshot CSV files. Keep paths relative to this
  #   YAML so the setup directory can move as one unit.
  a:
    label: snapshot_a
    path: snapshot_a

  b:
    label: snapshot_b
    path: snapshot_b

# ==============================================================================
# Audit Source CSV Files
# ==============================================================================
files:
  # Paths are relative to each snapshot directory. Column mappings must match
  # the CSV headings exactly.
  portfolio_performance:
    # Portfolio performance CSV; required for every Audit run.
    # Default: portperf.csv
    # Required columns: Portfolio Code, From Date, Thru Date, Portfolio Return.
    # Optional columns: Base Currency, Beginning Market Value, Ending Market
    #   Value, Gain/Loss, Income, Net Flow.
    path: portperf.csv
    columns:
      portfolio_code: "Portfolio Code"
      from_date: "From Date"
      thru_date: "Thru Date"
      portfolio_return: "Portfolio Return"
      base_currency: "Base Currency"
      begin_market_value: "Beginning Market Value"
      end_market_value: "Ending Market Value"
      gain_loss: "Gain/Loss"
      income: "Income"
      flow: "Net Flow"

  security_performance:
    # Security performance CSV; required for security-level Audit reports.
    # Default: secperf.csv
    # Required columns: Portfolio Code, Security Symbol, Security Type,
    #   From Date, Thru Date, Security Return.
    # Optional columns: Beginning Market Value, Beginning Weight, Contribution,
    #   Ending Market Value, Gain/Loss, Income.
    path: secperf.csv
    columns:
      portfolio_code: "Portfolio Code"
      security_symbol: "Security Symbol"
      security_type: "Security Type"
      from_date: "From Date"
      thru_date: "Thru Date"
      security_return: "Security Return"
      begin_market_value: "Beginning Market Value"
      weight: "Beginning Weight"
      contribution: "Contribution"
      end_market_value: "Ending Market Value"
      gain_loss: "Gain/Loss"
      income: "Income"

  holdings:
    # Holdings CSV; required for the starter's return reconstruction.
    # Default when required by configured reconstruction: holdings.csv
    # Required columns: Portfolio Code, Security Symbol, Security Type,
    #   Holding Date.
    # Optional columns: Accrued Income, Base Currency, Base Market Value,
    #   Currency Code, Market Value, Price, Quantity.
    path: holdings.csv
    columns:
      portfolio_code: "Portfolio Code"
      security_symbol: "Security Symbol"
      security_type: "Security Type"
      holding_date: "Holding Date"
      accrued: "Accrued Income"
      base_currency: "Base Currency"
      base_market_value: "Base Market Value"
      currency: "Currency Code"
      market_value: "Market Value"
      price: "Price"
      quantity: "Quantity"

  transactions:
    # Transactions CSV; required for the starter's return reconstruction.
    # Default when required by configured reconstruction: transactions.csv
    # Required columns: Portfolio Code, Security Symbol, Security Type,
    #   Transaction Date.
    # Optional columns: Amount, Base Amount, Base Currency, Commission, Currency
    #   Code, Price, Quantity, Settlement Date, Source/Destination Symbol,
    #   Source/Destination Type, Special Security Symbol, Special Security Type,
    #   Transaction Code, Transaction Security Type.
    path: transactions.csv
    columns:
      portfolio_code: "Portfolio Code"
      security_symbol: "Security Symbol"
      security_type: "Security Type"
      transaction_date: "Transaction Date"
      amount: "Amount"
      base_amount: "Base Amount"
      base_currency: "Base Currency"
      commission: "Commission"
      currency: "Currency Code"
      price: "Price"
      quantity: "Quantity"
      settlement_date: "Settlement Date"
      source_destination_symbol: "Source/Destination Symbol"
      source_destination_type: "Source/Destination Type"
      special_security_symbol: "Special Security Symbol"
      special_security_type: "Special Security Type"
      transaction_code: "Transaction Code"
      transaction_security_type: "Transaction Security Type"

  security_reference:
    # Security master CSV; required when Data Issues use reference fields.
    # Default when required by a configured reference filter: secmast.csv
    # Required columns: Security Symbol, Security Type.
    # Optional columns: Asset Class Code.
    path: secmast.csv
    columns:
      security_symbol: "Security Symbol"
      security_type: "Security Type"
      asset_class_code: "Asset Class Code"

  fx_rates:
    # FX-rate CSV; optional evidence for multi-currency data.
    # Default: None; this starter uses fx_rates.csv.
    # Required columns: From Currency, To Currency, Rate Date, FX Rate.
    # Optional columns: Local Exposure, Portfolio Code, Rate Source, Rate Type.
    path: fx_rates.csv
    columns:
      from_currency: "From Currency"
      to_currency: "To Currency"
      rate_date: "Rate Date"
      fx_rate: "FX Rate"
      local_exposure: "Local Exposure"
      portfolio_code: "Portfolio Code"
      rate_source: "Rate Source"
      rate_type: "Rate Type"

  splits:
    # Security-split CSV; optional evidence for split-adjusted prices.
    # Default: None; this starter uses splits.csv.
    # Required columns: Security Symbol, Security Type, Split Date,
    #   Split Factor.
    path: splits.csv
    columns:
      security_symbol: "Security Symbol"
      security_type: "Security Type"
      split_date: "Split Date"
      split_factor: "Split Factor"


# ==============================================================================
# Data Issues
# ==============================================================================
data_issues:
  # Whether to report optional Data Issues checks.
  # Default: true. Mandatory continuity checks always run.
  enabled: true

  holdings_nonpositive_price:
    # Flags a nonzero holding with a zero or negative price.
    # Default: disabled. This starter enables a filtered example.
    enabled: true
    only:
      security_reference.security_type: csus

  holdings_price_range:
    # Flags same-day holding prices that differ across portfolios.
    # Default: enabled. This starter limits the check to common stock.
    enabled: true
    only:
      security_reference.security_type: csus
    absolute_tolerance: 0.01
    percent_tolerance: 0.05

  holdings_stale_price:
    # Flags a positive holding price repeated for the configured number of days.
    # Default: disabled. This starter enables a common-stock example.
    enabled: true
    only:
      security_reference.security_type: csus
    minimum_calendar_days: 28

  large_price_variation:
    # Flags split-adjusted price variation within one portfolio period.
    # Default: disabled. This starter enables a common-stock example.
    enabled: true
    rules:
      - rule_id: common_stock_30_percent
        only:
          transactions.transaction_code:
            - by
            - sl
          security_reference.security_type: csus
        minimum_calendar_days: 1
        minimum_tolerance: 0.30

  transactions_price_range:
    # Flags same-day transaction prices that differ across portfolios.
    # Default: enabled. This starter limits the check to common-stock purchases.
    enabled: true
    only:
      transactions.transaction_code:
        - by
      security_reference.security_type: csus
    absolute_tolerance: 0.01
    percent_tolerance: 0.05

  transactions_nonpositive_price:
    # Flags a nonzero-quantity transaction with a nonpositive price.
    # Default: disabled. This starter enables a filtered purchase example.
    enabled: true
    only:
      transactions.transaction_code:
        - by
      security_reference.security_type: csus

  transaction_security_type_mismatch:
    # Flags a transaction security type that differs from the security master.
    # Default: disabled. This starter enables a common-stock example.
    enabled: true
    only:
      security_reference.security_type: csus

  deliver_in_original_cost_incomplete:
    # Flags missing original cost or cost date in a deliver-in population.
    # Default: disabled. Both original-cost columns are needed when enabled.
    enabled: false
    only:
      transactions.transaction_code: ti
      transactions.transaction_security_type: csus
      transactions.source_destination_type: $pty
      transactions.source_destination_symbol: external_delivery

  duplicate_transactions:
    # Flags exact duplicate transaction rows within a snapshot.
    # Default: enabled.
    enabled: true

  dividend_rate:
    # Flags same-day dividend rates that differ across portfolios.
    # Default: enabled. This starter targets its JPM dividend scenario.
    enabled: true
    only:
      security_id:
        - csusJPM
    absolute_tolerance: 0.01
    percent_tolerance: 0.5

  missing_dividend:
    # Flags an eligible holding that may be missing a dividend transaction.
    # Default: enabled. This starter targets its AAPL dividend scenario.
    enabled: true
    only:
      security_id:
        - csusAAPL

  pa_sa_rate:
    # Flags purchase/sale accrued rates that differ across portfolios.
    # Default: enabled. This starter limits the check to fixed income.
    enabled: true
    only:
      security_reference.asset_class_code: FI
    absolute_tolerance: 0.000001
    percent_tolerance: 0.5

  holdings_accrued_rate:
    # Flags same-day accrued-income rates that differ across portfolios.
    # Default: enabled. This starter targets one reviewed fixed-income issue.
    enabled: true
    only:
      security_id:
        - fius91282Y5Y1
      security_reference.asset_class_code: FI
    absolute_tolerance: 0.00001
    percent_tolerance: 0.5

# ==============================================================================
# Portfolio Return Reconstruction
# ==============================================================================
portfolio_return_reconstruction:
  # Return formula used to reconstruct portfolio performance.
  # Required. Supported value: modified_dietz.
  method: modified_dietz

  # Dataset supplying beginning values.
  # Required. Supported value: holdings.
  beginning_value_source: holdings

  # Dataset supplying ending values.
  # Required. Supported value: holdings.
  ending_value_source: holdings

  # Dataset supplying external flows and income.
  # Required. Supported value: transactions.
  flow_source: transactions

  # Transaction date used for flow weighting.
  # Required. Supported value: transaction_date.
  flow_timing: transaction_date

  # Day-count convention used for flow weighting.
  # Required. Supported value: actual_days.
  day_count: actual_days

  # Timing assigned to a flow on its transaction date.
  # Required. Supported value: beginning_of_day.
  inclusion_rule: beginning_of_day

  # Transaction categories treated as portfolio external flows.
  # Required. Supported starter value: external_flow.
  flow_categories:
    - external_flow

  # Transaction categories treated as portfolio income or expense.
  # Required. Supported starter values: income, fee_expense.
  income_categories:
    - income
    - fee_expense

  # Whether reconstructed returns are net or gross.
  # Required. Supported starter value: net.
  return_basis: net

  # How transaction amounts express cash-flow direction.
  # Required. Supported value: signed_amount.
  sign_convention: signed_amount


# ==============================================================================
# Security Return Reconstruction
# ==============================================================================
security_return_reconstruction:
  # Return formula used to reconstruct security performance.
  # Required for security reconstruction. Supported value: modified_dietz.
  method: modified_dietz

  # Dataset supplying beginning values.
  # Required. Supported value: holdings.
  beginning_value_source: holdings

  # Dataset supplying ending values.
  # Required. Supported value: holdings.
  ending_value_source: holdings

  # Dataset supplying security flows and income.
  # Required. Supported value: transactions.
  flow_source: transactions

  # Transaction date used for flow weighting.
  # Required. Supported value: transaction_date.
  flow_timing: transaction_date

  # Day-count convention used for flow weighting.
  # Required. Supported value: actual_days.
  day_count: actual_days

  # Timing assigned to a flow on its transaction date.
  # Required. Supported value: beginning_of_day.
  inclusion_rule: beginning_of_day

  # Transaction categories treated as security-level flows.
  # Required. Supported starter values: buy, sell.
  flow_categories:
    - buy
    - sell

  # Transaction categories treated as security income or expense.
  # Required. Supported starter values: income, fee_expense.
  income_categories:
    - income
    - fee_expense

  # Whether reconstructed returns are net or gross.
  # Required. Supported starter value: net.
  return_basis: net

  # How transaction amounts express cash-flow direction.
  # Required. Supported value: signed_amount.
  sign_convention: signed_amount

# ==============================================================================
# Transaction Rules
# ==============================================================================
transaction_rules:
  # Maps exact transaction codes to reviewed financial meanings.
  # Default: no internal code meanings; every supported meaning appears here.
  # Each rule specifies category, cash-flow sign, and performance-flow sign.
  # A conditional rule applies only when every field under when: matches.
  # Do not add or broaden a rule without reviewed local source evidence.
  by:
    transaction_category: buy
    cash_flow_sign: negative
    performance_flow_sign: performance
  sl:
    transaction_category: sell
    cash_flow_sign: positive
    performance_flow_sign: performance
  ss:
    - when:
        transaction_security_type: csus
        source_destination_type: awus
        source_destination_symbol: none
      transaction_category: sell
      cash_flow_sign: positive
      performance_flow_sign: performance
  cs:
    - when:
        transaction_security_type: csus
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: buy
      cash_flow_sign: negative
      performance_flow_sign: performance
  dv:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  # Fee expense; appropriate when reported returns are net of fees.
  dp:
    - when:
        special_security_type: exus
        special_security_symbol: custfee
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
    - when:
        special_security_type: epus
        special_security_symbol: with
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
  ai:
    # Margin interest; code-only ai remains unsupported.
    - when:
        transaction_security_type: caus
        source_destination_type: $pth
        source_destination_symbol: $cash
        special_security_type: caus
        special_security_symbol: margin
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
  in:
    transaction_category: income
    cash_flow_sign: positive
    performance_flow_sign: performance
  rc:
    # Return of capital; code-only rc remains unsupported.
    - when:
        transaction_security_type: csus
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: income
      cash_flow_sign: positive
      performance_flow_sign: performance
    - when:
        transaction_security_type: csus
      transaction_category: corporate_action
      cash_flow_sign: none
      performance_flow_sign: neutral
  pd:
    # Principal paydown; code-only pd remains unsupported.
    - when:
        transaction_security_type: fius
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: sell
      cash_flow_sign: positive
      performance_flow_sign: performance
  pa:
    # Purchase accrued interest; requires fixed-income context.
    - when:
        transaction_security_type: fius
      transaction_category: fee_expense
      cash_flow_sign: negative
      performance_flow_sign: performance
  sa:
    # Sale accrued interest; requires fixed-income context.
    - when:
        transaction_security_type: fius
      transaction_category: income
      cash_flow_sign: positive
      performance_flow_sign: performance
  li:
    # Long-in; external-party and internal-account contexts remain distinct.
    - when:
        source_destination_type: $pty
      transaction_category: external_flow
      cash_flow_sign: positive
      performance_flow_sign: external
    - when:
        source_destination_type: $acct
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral
  ti:
    # Deliver-in; code-only ti remains unsupported.
    - when:
        transaction_security_type: csus
        source_destination_type: $pty
        source_destination_symbol: external_delivery
      transaction_category: external_flow
      cash_flow_sign: positive
      performance_flow_sign: external
  lo:
    # Long-out; external-party and internal-account contexts remain distinct.
    - when:
        source_destination_type: $pty
      transaction_category: external_flow
      cash_flow_sign: negative
      performance_flow_sign: external
    - when:
        source_destination_type: $acct
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral
  ";":
    # Reserved corporate-action or journal marker.
    transaction_category: corporate_action
    cash_flow_sign: none
    performance_flow_sign: neutral
  wd:
    # Withdrawal; external cash and internal sweep contexts remain distinct.
    - when:
        security_id: causCASHUSD
        source_destination_type: $pty
        source_destination_symbol: $cash
      transaction_category: external_flow
      cash_flow_sign: negative
      performance_flow_sign: external
    - when:
        source_destination_type: $sweep
      transaction_category: transfer
      cash_flow_sign: none
      performance_flow_sign: neutral

# ==============================================================================
# Transaction Impact Methods
# ==============================================================================
transaction_impact_methods:
  # Converts changed external flows into estimated performance impact.
  # Required when transactions are configured.
  external_flow:
    method: modified_dietz
    flow_timing: trade_date
    day_count: actual_days
    inclusion_rule: beginning_of_day
    denominator_source: begin_market_value
    double_count_policy: cross_check_only

  # Converts changed income and expense amounts into performance impact.
  # Required when transactions are configured.
  performance:
    method: transaction_amount_delta_over_return_denominator
    denominator_source: begin_market_value

  # Keeps changed transaction quantities as review evidence.
  # Required when transactions are configured.
  quantity:
    method: evidence_only

  # Keeps changed transaction prices as review evidence.
  # Required when transactions are configured.
  price:
    method: evidence_only

  # Keeps changed commissions as review evidence.
  # Required when transactions are configured.
  commission:
    method: evidence_only


# ==============================================================================
# Security Return Impact Methods
# ==============================================================================
security_return_impact_methods:
  # Converts changed security transactions into estimated return impact.
  # Required for transaction-based security explanations.
  transactions:
    method: modified_dietz
    flow_timing: transaction_date
    day_count: actual_days
    inclusion_rule: beginning_of_day


# ==============================================================================
# Holding Impact Methods
# ==============================================================================
holding_impact_methods:
  # Converts changed holding values into estimated performance impact.
  # Required when holdings are configured.
  market_value:
    method: market_value_delta_over_return_denominator
    denominator_source: begin_market_value

  # Converts changed accrued income into estimated performance impact.
  # Required when holdings are configured.
  accrued:
    method: accrued_delta_over_return_denominator
    denominator_source: begin_market_value

  # Converts changed quantity into estimated performance impact.
  # Required when holdings are configured.
  quantity:
    method: quantity_delta_times_snapshot_a_unit_market_value_over_return_denominator
    denominator_source: begin_market_value

  # Keeps changed cost as review evidence.
  # Required when holdings are configured.
  cost:
    method: evidence_only


# ==============================================================================
# Price Impact Methods
# ==============================================================================
price_impact_methods:
  # Converts changed holding prices into estimated performance impact.
  # Required when holdings are configured.
  price:
    method: price_delta_over_snapshot_a_price_times_weight
    weight_source: snapshot_a_weight


# ==============================================================================
# Supporting-Evidence Impact Methods
# ==============================================================================
fx_rate_impact_methods:
  # Keeps changed FX rates as review evidence.
  # Required when FX rates are configured.
  fx_rate:
    method: evidence_only

evidence_only_impact_methods:
  # Source fields shown as evidence without adding estimated performance impact.
  # Required for each configured evidence-only dataset.
  splits:
    method: evidence_only
    source_fields:
      - split_factor
  fx_rates:
    method: evidence_only
    source_fields:
      - fx_rate


# ==============================================================================
# Comparison Tolerances
# ==============================================================================
tolerances:
  # Minimum differences reported by Audit.
  # All values are required. Return, contribution, and weight use decimals;
  #   market value uses currency units.
  return: 0.000001
  contribution: 0.000001
  weight: 0.000001
  market_value: 0.01
  quantity: 0.000001
  price: 0.000001
  split_factor: 0.00000001
  fx_rate: 0.00000001
