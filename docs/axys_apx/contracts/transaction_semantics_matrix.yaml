# Machine-readable companion to transaction_semantics_matrix.md.
# This is an implementation contract for ppar demo/test coverage, not an
# official Axys/APX transaction-code dictionary.
version: 1
source_document: transaction_semantics_matrix.md
coverage_statuses:
  covered_packaged_demo: Covered by packaged demo data and tests.
  covered_site_variant: Covered by site-variant fixtures and tests.
  covered_context_only: Covered as context for another transaction code.
  backlog: Documented backlog; no dedicated fixture yet.
  partial: Partially documented or tested, but not fully covered.
required_matrix_codes:
  - by
  - sl
  - ss
  - cs
  - dv
  - in
  - ai
  - sa
  - pa
  - rc
  - pd
  - li
  - ti
  - lo
  - dp
  - wd
  - ";"
  - epus
  - exus
ambiguous_external_flow_codes:
  - li
  - lo
  - ti
  - dp
  - wd
matching_rules:
  preserve_native_case: true
  current_semantics_rule_case_behavior: case_insensitive_implementation_gap
  required_semantics_rule_case_capability: exact_case_when_source_contract_requires
  case_insensitive_matching_requires_versioned_site_contract: true
  cancellation_requires_explicit_source_stage: true
  source_transaction_id: preferred_when_present_and_trustworthy
  strict_fallback_key:
    - portfolio
    - trade_date
    - security_identifier
    - transaction_code
  strict_fallback_requires_unique_one_to_one: true
  fuzzy_matching_allowed: false
  unmatched_rows_remain_reportable: true
  notes: >
    If a row cannot be matched conservatively, keep Snapshot A and Snapshot B
    rows unmatched. Added, deleted, duplicate same-day, and trade-date-moved
    transactions can still explain Modified Dietz numerator or weighted-flow
    effects without an inferred transaction linkage.
rows:
  by:
    observed_meaning: Buy; reinvestment buy leg; non-cash deposit paired leg.
    ppar_categories: [buy]
    cash_flow_signs: [negative]
    performance_flow_signs: [performance]
    required_evidence: [code, security, amount_or_quantity_signs]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: covered_packaged_demo
    fixtures: [packaged_demo]
    coverage_notes: Packaged demo includes normal buy rows; reinvestment-pair coverage remains backlog under pair_patterns.dv_by_reinvestment.
  sl:
    observed_meaning: Sell; positive closure leg.
    ppar_categories: [sell]
    cash_flow_signs: [positive]
    performance_flow_signs: [performance]
    required_evidence: [code, security, amount_or_quantity_signs]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: covered_packaged_demo
    fixtures: [packaged_demo]
    coverage_notes: Packaged demo includes normal sell rows with cash proceeds and security quantity changes.
  ss:
    observed_meaning: Short sale; ByAllAccounts APX mapping evidence maps SELL / SHORT to ss.
    ppar_categories: [sell, unknown_pending_review]
    cash_flow_signs: [positive, collateral_like, short_proceeds_specific, context_dependent]
    performance_flow_signs: [performance, unknown]
    required_evidence: [lowercase_code, security, quantity, amount, short_security_type_or_negative_exposure, cash_margin_short_symbols, source_destination_context]
    imex_confidence: medium_high_for_code_low_medium_for_mechanics
    rep_confidence: medium
    coverage_status: partial
    fixtures: [packaged_demo, site_variants/short_side_trades]
    coverage_notes: "Packaged demo covers lowercase ss only in a disclosed synthetic TSLA short lifecycle using real prices and explicit source/destination context; test-only site variant covers explicit short-security YAML classification. Code-only treatment remains unknown. Uppercase SS is only bounded staging/control cancellation evidence and requires explicit source-stage handling."
  cs:
    observed_meaning: Cover short; ByAllAccounts APX mapping evidence maps BUY / COVER SHORT to cs.
    ppar_categories: [buy, unknown_pending_review]
    cash_flow_signs: [negative, collateral_like, short_cash_release_specific, context_dependent]
    performance_flow_signs: [performance, unknown]
    required_evidence: [lowercase_code, security, quantity, amount, prior_or_resulting_short_exposure, cash_margin_short_symbols, source_destination_context]
    imex_confidence: medium_high_for_code_low_medium_for_mechanics
    rep_confidence: medium
    coverage_status: partial
    fixtures: [packaged_demo, site_variants/short_side_trades]
    coverage_notes: "Packaged demo covers lowercase cs only in a disclosed synthetic TSLA cover-short lifecycle using real prices and explicit source/destination context; test-only site variant covers explicit short-security YAML classification. Code-only treatment remains unknown. Uppercase CS is only bounded staging/control cancellation evidence and requires explicit source-stage handling."
  dv:
    observed_meaning: Dividend, dividend-paying security income, reinvested-dividend leg.
    ppar_categories: [income]
    cash_flow_signs: [positive]
    performance_flow_signs: [performance]
    required_evidence: [code, security_or_income_context, amount_sign]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: covered_packaged_demo
    fixtures: [packaged_demo]
    coverage_notes: Packaged demo includes ordinary dividend income rows; paired dividend-reinvestment coverage remains backlog under pair_patterns.dv_by_reinvestment.
  in:
    observed_meaning: Income, interest, cash-security dividend/income.
    ppar_categories: [income]
    cash_flow_signs: [positive]
    performance_flow_signs: [performance]
    required_evidence: [code, security_type, amount_sign]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: covered_packaged_demo
    fixtures: [packaged_demo]
    coverage_notes: Packaged demo includes fixed-income/cash income rows used as performance income.
  ai:
    observed_meaning: Negative interest or margin interest.
    ppar_categories: [fee_expense, income]
    cash_flow_signs: [negative, context_dependent]
    performance_flow_signs: [performance]
    required_evidence: [security_type, margin_symbols, amount_sign, local_mapping]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: partial
    fixtures: [packaged_demo, site_variants/ai_margin_interest]
    coverage_notes: Packaged demo and test-only site variant cover margin-style negative-interest treatment only through explicit contextual YAML rules. Code-only treatment remains unknown.
  sa:
    observed_meaning: Sale accrued interest or sell-side accrued interest.
    ppar_categories: [income, fee_expense]
    cash_flow_signs: [positive, context_dependent]
    performance_flow_signs: [performance, unknown]
    required_evidence: [bond_or_accrual_context, accrued_interest_amount, settlement_date, local_mapping]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: partial
    fixtures: [packaged_demo, site_variants/fixed_income_accruals]
    coverage_notes: Packaged demo includes sale accrued interest only with explicit fixed-income context and paired bond-trade scenario support; code-only treatment remains unknown.
  pa:
    observed_meaning: Purchase accrued interest or buy-side accrued interest.
    ppar_categories: [fee_expense, income]
    cash_flow_signs: [negative, context_dependent]
    performance_flow_signs: [performance, unknown]
    required_evidence: [bond_or_accrual_context, accrued_interest_amount, settlement_date, local_mapping]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: partial
    fixtures: [packaged_demo, site_variants/fixed_income_accruals]
    coverage_notes: Packaged demo includes purchase accrued interest only with explicit fixed-income context and paired bond-trade scenario support; code-only treatment remains unknown.
  rc:
    observed_meaning: Return of capital; ByAllAccounts Axys/APX mapping evidence points to portfolio-cash destination context.
    ppar_categories: [income, corporate_action]
    cash_flow_signs: [positive]
    performance_flow_signs: [performance, review_only]
    required_evidence: [code, security, amount_sign, cash_destination_context, local_mapping_or_report_treatment]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: partial
    fixtures: [packaged_demo, site_variants/rc_return_of_capital]
    coverage_notes: "Packaged demo covers rc only with explicit equity/security and return-of-capital context; test-only site variant covers a local Modified Dietz performance-income override. Code-only treatment remains unknown. Cost-basis handling is best-efforts demo-construction context, not required for this performance classification."
  pd:
    observed_meaning: Principal paydown or bond-security return-of-capital transaction; ByAllAccounts mapping evidence points to portfolio-cash destination context.
    ppar_categories: [sell, corporate_action]
    cash_flow_signs: [positive]
    performance_flow_signs: [performance, review_only]
    required_evidence: [bond_security_type, principal_paydown_context, cash_movement, principal_or_factor_context, local_mapping_or_report_treatment]
    imex_confidence: medium
    rep_confidence: medium
    coverage_status: partial
    fixtures: [packaged_demo, site_variants/pd_principal_paydown]
    coverage_notes: "Packaged demo covers pd only with MBS/amortizing-security, principal-paydown, and portfolio-cash destination context, using sell-like security-flow mechanics for Modified Dietz. Test-only site variant covers an explicit local override. Code-only treatment remains unknown. Principal, factor, cost-basis, and amortization handling are best-efforts demo-construction context."
  li:
    observed_meaning: Deliver in, transfer in, credit, deposit, positive movement.
    ppar_categories: [external_flow, transfer]
    cash_flow_signs: [positive, none]
    performance_flow_signs: [external, neutral]
    required_evidence: [source_destination_type, source_destination_symbol, security_type, amount_or_quantity_signs]
    imex_confidence: medium_context_required
    rep_confidence: medium_high
    coverage_status: covered_packaged_demo
    fixtures: [packaged_demo, site_variants/imex_context, site_variants/rep_semantics]
    coverage_notes: Packaged demo covers a contextual external cash contribution; site-variant fixtures cover external-party inflow and internal-transfer cases.
  ti:
    observed_meaning: Deliver in in the cited Axys missing-cost report workflow; exact site semantics remain context-dependent.
    ppar_categories: [external_flow, transfer]
    cash_flow_signs: [positive, none]
    performance_flow_signs: [external, neutral]
    required_evidence: [source_workflow, source_destination_type, source_destination_symbol, security_type, quantity, amount, local_mapping]
    imex_confidence: low_medium
    rep_confidence: medium_high_for_cited_workflow
    coverage_status: partial
    fixtures: [packaged_demo]
    coverage_notes: Packaged demo covers one site-scoped external-security deliver-in using explicit external-party and security context. Code-only ti remains unknown; internal-transfer treatment requires separate local evidence.
  lo:
    observed_meaning: Deliver out, transfer out, debit, withdrawal, negative movement.
    ppar_categories: [external_flow, transfer]
    cash_flow_signs: [negative, none]
    performance_flow_signs: [external, neutral]
    required_evidence: [source_destination_type, source_destination_symbol, security_type, amount_or_quantity_signs]
    imex_confidence: medium_context_required
    rep_confidence: medium_high
    coverage_status: covered_packaged_demo
    fixtures: [packaged_demo, site_variants/imex_context, site_variants/rep_semantics]
    coverage_notes: Packaged demo covers a contextual external cash deliver-out; site-variant fixtures cover external-party outflow and internal-transfer cases.
  dp:
    observed_meaning: Cash-security buy, tax, fee, recordkeeping, investment expense, service charge, debit-like case.
    ppar_categories: [fee_expense, transfer, unknown_pending_review]
    cash_flow_signs: [negative, none]
    performance_flow_signs: [performance, neutral, unknown]
    required_evidence: [special_security_type, special_security_symbol, source_destination_context, fee_tax_sweep_symbols]
    imex_confidence: medium_context_required
    rep_confidence: medium_high
    coverage_status: covered_site_variant
    fixtures: [packaged_demo, site_variants/imex_context, site_variants/rep_semantics]
    coverage_notes: Packaged demo covers fee-like dp; site-variant fixtures cover fee and transfer/sweep behavior plus REP/source semantics.
  wd:
    observed_meaning: Cash-security sell or withdrawal-like cash-security movement.
    ppar_categories: [external_flow, transfer, sell]
    cash_flow_signs: [negative, none]
    performance_flow_signs: [external, neutral, performance, unknown]
    required_evidence: [cash_security, source_destination_type, source_destination_symbol, amount_sign]
    imex_confidence: medium_context_required
    rep_confidence: medium_high
    coverage_status: covered_site_variant
    fixtures: [packaged_demo, site_variants/imex_context, site_variants/rep_semantics]
    coverage_notes: Packaged demo covers external cash withdrawal; site-variant fixtures cover external and transfer/sweep behavior plus REP/source semantics.
  ";":
    observed_meaning: Journal, Other, or locally materialized split marker in integration tables.
    ppar_categories: [corporate_action, unknown_pending_review]
    cash_flow_signs: [none, context_dependent]
    performance_flow_signs: [neutral, review_only, unknown]
    required_evidence: [corporate_action_or_report_context, split_factor_extract, local_mapping]
    imex_confidence: low
    rep_confidence: medium
    coverage_status: covered_site_variant
    fixtures: [site_variants/review_only_actions]
    coverage_notes: Test-only review-only action fixture proves synthetic corporate-action markers can stay neutral; normal Axys split evidence should use split-factor extracts such as split.inf rather than requiring account-level transaction rows.
  epus:
    observed_meaning: Management fee or fee-related token in conversion evidence.
    ppar_categories: [fee_expense]
    cash_flow_signs: [negative]
    performance_flow_signs: [performance]
    required_evidence: [token_role, fee_symbol, local_mapping]
    imex_confidence: low_medium
    rep_confidence: medium
    coverage_status: covered_context_only
    fixtures: [site_variants/alternate_fee_context]
    coverage_notes: Site variant covers epus only as special-security context for a dp expense row. Evidence that epus is a universal standalone transaction code remains absent.
  exus:
    observed_meaning: Expense or fee-related token in conversion and special-security evidence.
    ppar_categories: [fee_expense]
    cash_flow_signs: [negative]
    performance_flow_signs: [performance]
    required_evidence: [token_role, fee_symbol, local_mapping]
    imex_confidence: low_medium
    rep_confidence: medium
    coverage_status: covered_context_only
    fixtures: [packaged_demo, site_variants/imex_context]
    coverage_notes: Covered only as special-security context for dp fee examples; standalone transaction-code treatment remains unproven.
pair_patterns:
  dp_wd:
    codes: [dp, wd]
    ppar_treatment: transfer_neutral_when_context_proves_internal_sweep
    coverage_status: covered_site_variant
    coverage_notes: IMEX-context fixture covers sweep/transfer rows; broader pairing/reversal matching remains future work.
  li_lo:
    codes: [li, lo]
    ppar_treatment: transfer_neutral_unless_external_party_context_proves_external_flow
    coverage_status: covered_site_variant
    coverage_notes: IMEX-context fixture covers external-party and internal-account cases for both codes; demo-data audit tests also prove inserted cash li/lo rows drive cash impacts only when context proves external movement.
  ti_to:
    codes: [ti, to]
    ppar_treatment: unknown_pending_review
    coverage_status: backlog
    coverage_notes: Backlog pending transaction-code evidence and local mapping for this cash-journal pair family.
  si_so:
    codes: [si, so]
    ppar_treatment: unknown_pending_review
    coverage_status: backlog
    coverage_notes: Backlog pending transaction-code evidence and local mapping for this cash-journal pair family.
  tr_ts:
    codes: [tr, ts]
    ppar_treatment: unknown_pending_review
    coverage_status: backlog
    coverage_notes: Backlog pending transaction-code evidence and local mapping for this cash-journal pair family.
  dv_by_reinvestment:
    codes: [dv, by]
    ppar_treatment: performance_pair_avoid_external_flow_double_count
    coverage_status: covered_packaged_demo
    coverage_notes: Packaged demo uses matched dv/by rows with dividend-wash context, aligned dates and security, offsetting amounts, no portfolio external flow, and one dividend-income amount.
