# Starter site extract contract for Axys/APX performance-comparison inputs.
#
# See ../../../audit/site_extract_readiness_checklist.md before adapting this template.
#
# Copy this file beside a comparison YAML, trim the columns to fields your
# local IMEX/REP extract actually exposes, and reference it with:
#
# extract_contract:
#   path: site_extract_contract.yaml
#   enforce_ambiguous_axys_flows: true
#
# Keep ambiguous-flow enforcement on unless you have a deliberate local review
# reason to opt out. With enforcement on, dp/li/lo/ti/wd rows require either:
#
# - IMEX context fields that conditional transaction_rules can inspect, such as
#   source/destination and special-security fields; or
# - REP/report/custom-report fields that already carry reviewed category/sign
#   semantics.
#
# Every listed transaction column must use a supported ppar transaction alias
# and must define both boolean guard flags below. Only list columns that your
# local extract actually includes.
datasets:
  transactions.csv:
    columns:
      SEC_TYPE:
        requires_context_for_semantics: true
        blocking_if_missing: true
      SRC_DEST_TYPE:
        requires_context_for_semantics: true
        blocking_if_missing: true
      SRC_DEST_SYMBOL:
        requires_context_for_semantics: true
        blocking_if_missing: true
      SPECIAL_SEC_TYPE:
        requires_context_for_semantics: true
        blocking_if_missing: true
      SPECIAL_SEC_SYMBOL:
        requires_context_for_semantics: true
        blocking_if_missing: true
