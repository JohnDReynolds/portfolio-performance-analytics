<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Performance Comparison Review Workflow</title>
  <desc id="desc">A workflow diagram showing snapshot A and snapshot B feeding portfolio or security differences, underlying causes, and an Excel review workbook.</desc>
  <rect width="1200" height="520" fill="#f7f9fb"/>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #1f2933; }
    .subtitle { font: 400 18px Arial, sans-serif; fill: #52606d; }
    .label { font: 700 18px Arial, sans-serif; fill: #1f2933; }
    .body { font: 400 15px Arial, sans-serif; fill: #3e4c59; }
    .small { font: 400 13px Arial, sans-serif; fill: #52606d; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
    .accent { fill: #e6f4f1; stroke: #2f9e8f; stroke-width: 2; rx: 8; }
    .output { fill: #eef2ff; stroke: #667eea; stroke-width: 2; rx: 8; }
    .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>

  <text x="60" y="62" class="title">Performance Comparison</text>
  <text x="60" y="94" class="subtitle">Answer: what changed, and which source-data differences explain it?</text>

  <rect x="70" y="145" width="220" height="120" class="box"/>
  <text x="100" y="185" class="label">Snapshot A</text>
  <text x="100" y="216" class="body">Prior vendor extract</text>
  <text x="100" y="242" class="small">performance, positions,</text>
  <text x="100" y="262" class="small">transactions, prices, cash</text>

  <rect x="70" y="300" width="220" height="120" class="box"/>
  <text x="100" y="340" class="label">Snapshot B</text>
  <text x="100" y="371" class="body">Current vendor extract</text>
  <text x="100" y="397" class="small">same datasets, same schema</text>

  <rect x="405" y="185" width="265" height="170" class="accent"/>
  <text x="435" y="225" class="label">Reported Differences</text>
  <text x="435" y="258" class="body">Portfolio Differences sheet</text>
  <text x="435" y="285" class="body">Security Differences sheet</text>
  <text x="435" y="318" class="small">Which periods changed?</text>

  <rect x="790" y="145" width="310" height="120" class="output"/>
  <text x="820" y="185" class="label">Underlying Causes sheet</text>
  <text x="820" y="216" class="body">Prices, holdings, cash,</text>
  <text x="820" y="242" class="body">transactions, accrued interest</text>

  <rect x="790" y="300" width="310" height="120" class="output"/>
  <text x="820" y="340" class="label">Review Workbook</text>
  <text x="820" y="371" class="body">report.xlsx and report.html</text>
  <text x="820" y="397" class="small">Actionable review trail</text>

  <path d="M 295 205 L 395 245" class="arrow"/>
  <path d="M 295 360 L 395 300" class="arrow"/>
  <path d="M 675 245 L 780 205" class="arrow"/>
  <path d="M 945 270 L 945 290" class="arrow"/>
</svg>
